  // 垂直菜单子菜单切换函数
  function toggleVerticalSubmenu(event, button) {
    // 阻止事件冒泡

    if (!button) return;

    // 找到子菜单元素和图标

    // 确定图标位置并检查当前状态
    const isButtonFullWidth = button.classList.contains("flex-1");
    const icon = isButtonFullWidth

    const isOpen = submenu.classList.contains("max-h-0");

    // 执行展开或收起动画

  // 关闭搜索模态框
  window.closeSearchModal = function () {

  // ESC键关闭模态框
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      const modal = document.getElementById("search-modal");
      if (modal && modal.getAttribute("data-open") === "true") {
        window.searchModalController.close();
      }
    }
  });

  // 点击背景关闭模态框
  document.addEventListener("click", function (event) {
    const modal = document.getElementById("search-modal");

      event.target === modal &&
      modal.getAttribute("data-open") === "true"
    ) {
      window.searchModalController.close();

  // 动态检测搜索结果抽屉是否需要滚动条
  function updateDrawerScrollbar() {
    const drawer = document.querySelector(
      ".pagefind-ui-modal .pagefind-ui__drawer"
    );
    if (drawer) {
      const needsScrollbar = drawer.scrollHeight > drawer.clientHeight;
      if (needsScrollbar) {
        drawer.classList.add("has-scrollbar");
      } else {
        drawer.classList.remove("has-scrollbar");
      }
    }
  }

  // 处理mark标签中的空格
  function processMarkTags() {
    const marks = document.querySelectorAll(
      ".pagefind-ui-modal .pagefind-ui__result-excerpt mark"
    );
    marks.forEach((mark) => {
      // 获取原始文本并去除前后空格
      const originalText = mark.textContent || "";
      const trimmedText = originalText.trim();

      // 如果文本有变化，更新内容
      if (originalText !== trimmedText) {
        mark.textContent = trimmedText;
      }

      // 同时处理内部的多个连续空格
      const normalizedText = trimmedText.replace(/\s+/g, " ");
      if (trimmedText !== normalizedText) {
        mark.textContent = normalizedText;
      }
    });
  }

  // 监听搜索结果变化
  const observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (mutation) {
      if (mutation.type === "childList") {
        updateDrawerScrollbar();
        // 处理mark标签中的空格
        processMarkTags();
      }
    });
  });

  // 修改搜索输入框的placeholder文本
  function updateSearchPlaceholder() {

  // 当搜索模态框打开时开始监听
  const originalOpen = window.searchModalController.open;

        observer.observe(drawer, { childList: true, subtree: true });
      }

  // 当搜索模态框关闭时停止监听
  const originalClose = window.searchModalController.close;
  window.searchModalController.close = function () {
    observer.disconnect();

  // 监听搜索输入，实时处理mark标签

      // 延迟处理，等待搜索结果更新
      setTimeout(processMarkTags, 100);

  });

  (function () {

  // 切换主题
  function toggleTheme() {
    if (typeof window === "undefined") return;

    const isDark = document.documentElement.classList.contains("dark");

    if (isDark) {
      document.documentElement.classList.remove("dark");
      localStorage.setItem("theme", "light");
    } else {
      document.documentElement.classList.add("dark");
      localStorage.setItem("theme", "dark");
    }
  }
</script> <!-- 布局宽度管理 --> <script>
  // 布局宽度管理 - 初始化与切换（防闪烁优化）
  (function () {
    const LAYOUT_KEY = "layoutWidth";
    const WIDE_CLASS = "w-full";
    const NARROW_CLASS = "container";

    // 预初始化：在DOM解析阶段应用保存的设置
    function preInitLayoutWidth() {
      const saved = localStorage.getItem(LAYOUT_KEY);
      if (saved === "wide") {
        // 使用CSSOM直接操作，避免重绘
        const style = document.createElement("style");
        style.textContent =
          ".layout { width: 100% !important; max-width: none !important; }";
        style.id = "layout-preinit";
        document.head.appendChild(style);
      }
    }

    // 应用布局宽度到所有元素
    function applyLayoutWidth(isWide) {
      // 移除预初始化样式
      const preinitStyle = document.getElementById("layout-preinit");
      if (preinitStyle) preinitStyle.remove();

      document.querySelectorAll(".layout").forEach((el) => {
        el.classList.toggle(WIDE_CLASS, isWide);
        el.classList.toggle(NARROW_CLASS, !isWide);
      });
    }

    // 初始化布局宽度
    function initLayoutWidth() {
      const saved = localStorage.getItem(LAYOUT_KEY);
      if (saved === "wide") applyLayoutWidth(true);
    }

    // 切换布局宽度
    window.toggleLayoutWidth = function () {
      const current = localStorage.getItem(LAYOUT_KEY) === "wide";
      const next = !current;

      applyLayoutWidth(next);
      localStorage.setItem(LAYOUT_KEY, next ? "wide" : "narrow");

      // 验证修正（防抖）
      clearTimeout(window._layoutVerifyTimer);
      window._layoutVerifyTimer = setTimeout(() => {
        const shouldBeWide = localStorage.getItem(LAYOUT_KEY) === "wide";
        document.querySelectorAll(".layout").forEach((el) => {
          const isWide = el.classList.contains(WIDE_CLASS);
          if (shouldBeWide !== isWide) {
            el.classList.toggle(WIDE_CLASS, shouldBeWide);
            el.classList.toggle(NARROW_CLASS, !shouldBeWide);
          }
        });
      }, 50);
    };

    // 预初始化（在DOM解析阶段执行）
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", preInitLayoutWidth);
    } else {
      preInitLayoutWidth();
    }

    // 完整初始化（DOM就绪后）
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initLayoutWidth);
    } else {

--> <script>(function(){const documentsData = [{"id":"react-入门教程","slug":"react-入门教程","title":"React 入门系列","description":"React 入门系列，从0~1逐步入门 React 前端框架","cover":"/coding-one-more-time/cover/react-series.webp","docs":[{"id":"React 入门教程/1. React 基础内容.md","slug":"react-入门教程/1-react-基础内容","body":"## 1. React 组件 与 JSX/TSX\n\nReact组件使用 jsx/tsx 编写，最纯粹的js/ts开发。React组件可以是一个方法，也可以是一个class类。可以在js/ts文件中写一段html作为一个组件，可以可一个单独的jsx或js/tsx或ts文件。\n\n**React 组件分类**：1. 函数组件；2. Class 组件。\n\n```tsx\n// 函数组件\nfunction HelloComponent(){\n    return (\n        <>\n            <h1>Hello, World!</h1>\n        </>\n    )\n}\n\n// Class 组件\nclass HelloComponent extends React.Component {\n    render() {\n        return (\n            <>\n                <h1>Hello, World!</h1>  \n            </>\n        );\n    }\n}\n```\n\n**JSX 的特点**：\n\n1. 可以直接写在js文件中：React项目利用babel做了对js的编译。\n2. JSX几乎和js一样，不同点在于，可以更方便的写html在js里。\n\n## 2. React 项目初始化\n\n使用vite创建一个 React 项目：\n\n```bash\nnpm create vite@latest demo-react-ui -- --template react-ts\n```\n\n项目目录结构：\n\n```txt\ndemo-react-ui/\n├── node_modules/         # 项目依赖（npm install 后生成）\n├── public/               # 静态资源目录\n│   └── vite.svg          # Vite 默认图标\n├── src/                  # 源代码目录\n│   ├── assets/           # 静态资源（如图片、图标）\n│   │   └── react.svg     # React 图标\n│   ├── App.tsx           # 根组件（React 主入口）\n│   ├── App.css           # App 组件的样式\n│   ├── index.css         # 全局样式\n│   ├── main.tsx          # 应用入口文件（挂载 React）\n│   └── vite-env.d.ts     # Vite 的类型声明文件\n├── .gitignore            # Git 忽略文件配置\n├── index.html            # HTML 模板（Vite 的入口）\n├── package.json          # 项目配置与依赖信息\n├── package-lock.json     # 精确版本锁文件\n├── tsconfig.json         # TypeScript 配置\n├── tsconfig.node.json    # Node 端 TypeScript 配置\n├── vite.config.ts        # Vite 构建工具配置\n└── README.md             # 项目说明文档（可选）\n```\n\n## 3. React 的样式添加\n\n样式添加：使用 `className` 来指定一个css的class，与HTML的`class`属性相同\n\n```css\n.selfClass {\n    color: red;\n}\n```\n\n```tsx\nimport \"./FunctionComponent.css\";\n\nfunction FunctionComponent() {\n    return (\n        <>\n            <div>Function Component</div>\n            <div className=\"selfClass\">自定义样式</div>\n        </>\n    );\n}\n\nexport default FunctionComponent;\n```\n\n单独添加 css 样式，仅作用域当前组件/页面：\n\n1. css-module：原生支持的样式控制效果。\n2. 三方库：`classnames`/`styled-components`。`classnames`：需要借助预先定义的css；`styled-components`：通过预定义元素样式模板，然后直接使用。\n\n\ncss-module 原生支持的样式控制效果：\n\n```css\n/* FunctionComponent.module.css */\n.el-span {\n  width: 100px;\n  height: 28px;\n  line-height: 28px;\n  padding: 2px 4px;\n  border-radius: 4px;\n  background-color: cornflowerblue;\n  color: white;\n}\n```\n\n```tsx\n// FunctionComponent.tsx\nimport style from \"./FunctionComponent.module.css\"\n\nfunction FunctionComponent() {\n\n    return (\n        <>\n            <div>\n                <span className={style[\"el-span\"]}>\n\t                Component's span element\n\t            </span>\n            </div>\n        </>\n    )\n\n}\n\nexport default FunctionComponent;\n\n// App.tsx\nimport './App.css'\nimport FunctionComponent from './components/FunctionComponent';\n\nfunction App() {\n\n\n  return (\n    <>\n      <span className='el-span'>App's span element</span>\n      <FunctionComponent />\n    </>\n  )\n}\n\nexport default App\n```\n\n三方库 `classnames`/`styled-components`:\n\n```shell\n// classnames需要借助预先定义的css\nnpm install classnames\n// 通过预定义元素样式模板，然后直接使用\nnpm install styled-components\n```\n\n```css\n/* FunctionComponent.module.css */\n.el-span {\n  width: 100px;\n  height: 28px;\n  line-height: 28px;\n  padding: 2px 4px;\n  border-radius: 4px;\n  background-color: cornflowerblue;\n  color: white;\n}\n```\n\n```tsx\n// FunctionComponent.tsx\nimport style from \"./FunctionComponent.module.css\"\nimport classNames from \"classnames/bind\";\nconst cls = classNames.bind(style);\n\nimport styled from \"styled-components\";\nconst SpanStyle = styled.span`\n    width: 100px;\n    height: 28px;\n    line-height: 28px;\n    padding: 2px 4px;\n    border-radius: 4px;\n    background-color: cornflowerblue;\n    color: white;\n`;\n\nfunction FunctionComponent() {\n\n    return (\n        <>\n            <div>\n                <span className={style[\"el-span\"]}>\n\t                Component's span element\n\t            </span>\n                <br />\n                <span className={cls(\"el-span\")}>\n\t                Component's span element by classnames\n\t            </span>\n                <br />\n                <SpanStyle>\n\t                Component's span element by styled-components\n\t            </SpanStyle>\n            </div>\n        </>\n    )\n\n}\n\nexport default FunctionComponent;\n\n// App.tsx\nimport './App.css'\nimport FunctionComponent from './components/FunctionComponent';\n\nfunction App() {\n\n\n  return (\n    <>\n      <span className='el-span'>App's span element</span>\n      <FunctionComponent />\n    </>\n  )\n}\n\nexport default App\n```\n\n## 4. React 的 state 更新数据\n\n**state的注意点**：\n\n1. 直接修改是无法进行界面数据更新，必须要通过对应的方法修改state内容才能触发视图更新。\n2. 修改时一个浅合并的过程。\n\n```tsx\nimport { useState } from \"react\";\n\n    let [count, setCount] = useState(0);\n\n    function incrementCount() {\n        setCount(count + 1);\n    }\n\n    return (\n        <>\n            <div>Function Component</div>\n            <div>Count: {count}</div>\n            <button onClick={incrementCount}>Increment</button>\n        </>\n    );\n}\n\nexport default FunctionComponent;\n```\n\n## 5. React 的列表渲染\n\n列表渲染：可以使用 `for循环`；也可以使用 `array的map()函数`。\n\n**列表渲染注意点**：在循环中一定要有一个key属性，表明当前元素的唯一性。\n\n```tsx\nimport { useState } from \"react\";\nfunction FunctionComponent() {\n\n    let [list, setList] = useState<string[]>([\"a\", \"b\", \"c\"]);\n\n    function incrementList() {\n        setList([...list, String.fromCharCode(97 + list.length)]);\n    }\n\n    return (\n        <>\n            <div>Function Component</div>\n            <div>Count: {list.length}</div>\n            <button onClick={incrementList}>Add Item</button>\n            {\n                list.map((item, index) => {\n                    return (\n                        <div key={index}>Item: {item}</div>\n                    )\n                })\n            }\n        </>\n    );\n}\n\nexport default FunctionComponent;\n```\n\n## 6. React 的条件渲染\n\n条件渲染：可以使用 `if` 语句；可以使用 `条件? 满足条件 : 不满足条件` 三元运算；还可以使用 `逻辑 && 展示内容` 逻辑展示。\n\n```tsx\nimport { useState } from \"react\";\n\nfunction FunctionComponent() {\n\n    let [show, setShow] = useState(true);\n\n    function changeShow() {\n        setShow(!show);\n    }\n\n    return (\n        <>\n            <div>Function Component</div>\n            <div>{show && \"显示出来\"}</div>\n            <div>{show ? \"显示出来\" : \"隐藏了\"}</div>\n            <button onClick={changeShow}>change</button>\n        </>\n    );\n}\n\nexport default FunctionComponent;\n```\n\n## 7. React 的生命周期\n\n**React 主要的生命周期**：\n\n渲染时期（Mount）：\n\n1. render：渲染之前，执行render决定模版。\n2. componentDidMount：已经完成了渲染。\n\n更新时期（Update）：\n\n1. shouldComponentUpdate：是否应该重新渲染。\n2. componentDidUpdate：完成更新时。\n\n卸载时期（Unmount）：\n\n1. componentWillUnmount：即将卸载时。\n\n**React 18开发模式下生命周期整个执行过程**：\n\n1. 先按正常流程走一遍：`constructor → render → useEffect(mount) → useEffect(update)`。\n2. 立即把组件卸载（触发 cleanup）。\n3. 再重新挂载一次（触发第二次 mount + update），用来帮你检查副作用是否可重入、有没有内存泄漏。\n\n```tsx\n// FunctionComponent.tsx\nimport { useEffect, useState } from \"react\";\n\nfunction FunctionComponent() {\n    /* ---------- 1. Mount 阶段 ---------- */\n    useEffect(() => {\n        console.log('[Mount] DOM 已挂载，只会执行一次');\n        // 模拟异步请求\n        const timer = setTimeout(() => setLoaded(true), 3000);\n\n        /* ---------- 3. Unmount 阶段 ---------- */\n        return () => {\n            console.log('[Unmount] 组件即将销毁，清理副作用');\n            clearTimeout(timer);\n        };\n    }, []); // 空依赖 = 只跑一次\n\n    /* ---------- 2. Update 阶段 ---------- */\n    const [count, setCount] = useState(0);\n    const [loaded, setLoaded] = useState(false);\n\n    useEffect(() => {\n        console.log('[Update] count 或 loaded 变化了', { count, loaded });\n    }, [count, loaded]);\n\n    return (\n        <div style={{ padding: 20 }}>\n            <h2>Lifecycle Demo</h2>\n            <p>loaded: {loaded ? '✅' : '⏳'}</p>\n            <p>count: {count}</p>\n            <button onClick={() => setCount(c => c + 1)}>+1</button>\n        </div>\n    );\n}\n\nexport default FunctionComponent;\n\n// App.tsx\nimport { useState } from 'react';\nimport './App.css'\nimport FunctionComponent from './pages/FunctionComponent'\n\nfunction App() {\n  const [show, setShow] = useState(true);\n\n  return (\n    <>\n      <button onClick={() => setShow(s => !s)}>挂载/卸载</button>\n      {show && <FunctionComponent />}\n    </>\n  )\n}\n\nexport default App\n```\n\n生命周期执行效果：\n\n```txt\n[Mount] DOM 已挂载，只会执行一次\n[Update] count 或 loaded 变化了 {count: 0, loaded: false}\n[Unmount] 组件即将销毁，清理副作用\n// 1. 在默认的React.StrictMode模式下，会故意把组件 mount → unmount → mount 快速重演一次。在生产中不会出现。\n[Mount] DOM 已挂载，只会执行一次\n[Update] count 或 loaded 变化了 {count: 0, loaded: false}\n// 2. 这是正常流程挂载的流程。\n[Update] count 或 loaded 变化了 {count: 0, loaded: true}\n// 3. 触发异步事件的响应const timer = setTimeout(() => setLoaded(true), 3000);从新渲染。\n```\n\n## 8. React 的双向绑定\n\nReact 的双向绑定，需要借助 `form` 的`value`属性和`onChange`事件。\n\n```tsx\nimport { useState } from \"react\";\n\nfunction FunctionComponent() {\n    const [obj, setObj] = useState({\n        name: \"\",\n        age: 0\n    })\n\n    function handleNameValue(value: string) {\n        setObj({\n            ...obj,\n            name: value\n        })\n    }\n\n    function handleAgeValue(value: string) {\n        const _value = parseInt(value, 10) || 0;\n        setObj({\n            ...obj,\n            age: _value\n        })\n    }\n\n    return (\n        <>\n            <form>\n                <div>\n                    <label>name:</label>\n                    <input value={obj.name} onChange={(e) => handleNameValue(e.target.value)} />\n                </div>\n                <div>\n                    <label>age:</label>\n                    <input value={obj.age} onChange={(e) => handleAgeValue(e.target.value)} />\n                </div>\n            </form>\n            <div>\n                {\"current info: \" + obj.name + \" : \" + obj.age}\n            </div>\n        </>\n    );\n}\n\nexport default FunctionComponent;Ï\n```\n\n## 9. React 的监听事件\n\nReact 的双向绑定，需要借助 React 的`useEffect()`函数。\n\n```tsx\nimport { useEffect, useState } from \"react\";\n\nfunction FunctionComponent() {\n    const [count, setCount] = useState(0)\n\n\n    function handleAddCount() {\n        let _count = count;\n        _count++;\n        console.log(\"执行顺序：\" + 1)\n        setCount(_count); // 异步执行，所以执行顺序为：1 3 2\n        console.log(\"执行顺序：\" + 3)\n    }\n\n    // 实现属性监听效果（watch）\n    const [info, setInfo] = useState(\"\")\n    useEffect(() => {\n        console.log(\"执行顺序：\" + 2)\n        // 监听 count 变化\n        console.log(\"count is change. \" + count)\n\n        // 增加额外提示\n        if (count != 0) {\n            let _info = \"count is change. current count is \" + count;\n            setInfo(_info);\n        }\n    }, [count])\n\n    return (\n        <>\n            <div>{\"current count is \" + count}</div>\n            <button onClick={handleAddCount}>add count</button>\n            <p>{info}</p>\n        </>\n    );\n}\n\nexport default FunctionComponent;\n```\n\n## 10. React 的计算属性\n\nReact 的计算属性，需要借助 React 的`useMemo()`函数。\n\n```tsx\nimport { useMemo, useState } from \"react\";\n\nfunction FunctionComponent() {\n    const [text, setText] = useState(\"\")\n\n    function handleTextValue(value: string) {\n        let _text = value;\n        setText(_text);\n    }\n\n    // 实现计算属性效果（computer）\n    let _length = useMemo(() => {\n        return text.length;\n    }, [text])\n\n\n    return (\n        <>\n            <form>\n                <div>\n                    <label>text:</label>\n                    <input value={text} onChange={(e) => handleTextValue(e.target.value)} />\n                </div>\n            </form>\n            <p>{\"current input text length is \" + _length}</p>\n        </>\n    );\n}\n\nexport default FunctionComponent;Ï\n```\n\n## 11. React 的父子组件传值\n\n父子组件传值：通过组件定义属性进行传入。\n\n```tsx\n// FunctionComponent.tsx\nimport { useState } from \"react\";\n\nfunction FunctionComponent(props: any) {\n    // 父向子传值\n    const [_count, _setCount] = useState(props.count);\n\n    function handleAddCount() {\n        let _currentCount = _count;\n        _currentCount++;\n        _setCount(_currentCount);\n        // 子向父传值\n        props.setCount(_currentCount);\n    }\n    function handleMinusCount() {\n        let _currentCount = _count;\n        _currentCount--;\n        _setCount(_currentCount);\n        // 子向父传值\n        props.setCount(_currentCount);\n    }\n\n    function handleAddListItem() {\n        const newList = [...props.list, String.fromCharCode(97 + props.list.length)];\n        props.setList(newList);\n    }\n\n    return (\n        <>\n            <div>Function Component page：</div>\n            <div>\n                <button onClick={handleAddCount}>Add</button>\n                <span> {_count} </span>\n                <button onClick={handleMinusCount}>Minus</button>\n            </div>\n            \n            <div>\n                <div>List: <button onClick={handleAddListItem}>Add List Item</button></div>\n                <ul>\n                    {\n                        props.list.map((item: string, index: number) => (\n                            <li key={index}>{item}</li>\n                        ))\n                    }\n                </ul>\n            </div >\n        </>\n    )\n}\n\nexport default FunctionComponent;\n\n// App.tsx\nimport { useState } from 'react';\nimport './App.css'\nimport FunctionComponent from './components/FunctionComponent';\n\nfunction App() {\n\n  const [count, setCount] = useState(0);\n  const [list, setList] = useState([\"a\", \"b\", \"c\"]);\n\n  return (\n    <>\n      <div>App's count value is {count}</div>\n      <div>App's list value is {list}</div>\n      <FunctionComponent count={count} setCount={setCount} list={list} setList={setList} />\n    </>\n  )\n}\n\nexport default App\n```\n\n## 12. React 的动画效果\n\n动画效果：使用 `react-transition-group`\n\n```shell\nnpm install react-transition-group\n```\n\n```css\n/* transition.css */\n.el-div-enter {\n    opacity: 0;\n    transform: translateY(-20px);\n}\n\n.el-div-enter-active {\n    opacity: 1;\n    transform: translateY(0);\n    transition: all 300ms ease-in-out;\n}\n\n.el-div-enter-done {\n    opacity: 1;\n    transform: translateY(0);\n}\n\n.el-div-exit {\n    opacity: 1;\n    transform: translateY(0);\n}\n\n.el-div-exit-active {\n    opacity: 0;\n    transform: translateY(-20px);\n    transition: all 300ms ease-in-out;\n}\n\n.el-div-exit-done {\n    opacity: 0;\n    transform: translateY(-20px);\n}\n```\n\n```tsx\n// FunctionComponent.tsx\nimport { useState, useRef } from \"react\";\nimport { CSSTransition } from \"react-transition-group\";\nimport \"./transition.css\";\n\nfunction FunctionComponent() {\n    const [show, setShow] = useState(false);\n    const nodeRef = useRef(null);\n\n    function handleController() {\n        setShow(prev => !prev);\n    }\n\n    return (\n        <>\n            <div>\n                Function Component page：\n                <button onClick={handleController}>\n\t                {show ? \"隐藏\" : \"显示\"}\n\t            </button>\n            </div>\n\n            <CSSTransition\n                in={show}\n                timeout={300}\n                classNames=\"el-div\"\n                nodeRef={nodeRef}\n                unmountOnExit\n            >\n                <div ref={nodeRef}>\n                    <div>This is a CSSTransition component</div>\n                    <div>It will enter and exit with animation effects</div>\n                </div>\n            </CSSTransition>\n        </>\n    );\n}\n\nexport default FunctionComponent;\n```\n\n## 13. React 的DOM操作\n\nDOM操作：通过`event`获取当前事件信息，借助`useRef`获取当前元素信息。\n\n```css\n/* functionComponent.css */\n.move-node {\n  position: absolute;\n  width: 150px;\n  height: 150px;\n  line-height: 150px;\n  text-align: center;\n  border: 1px solid #000;\n  user-select: none;\n}\n```\n\n```tsx\n// FunctionComponent.tsx\nimport { useRef, useState } from \"react\";\nimport \"./functionComponent.css\";\n\nfunction FunctionComponent() {\n    const [node, setNode] = useState({\n        moving: false,\n        message: \"Move me!\",\n        position: { left: '50%', top: '50%' },\n        relativePosition: { x: 0, y: 0 },\n    })\n\n    const nodeRef = useRef<HTMLDivElement>(null);\n\n    function handleMouseDown(event: any) {\n        const _node = nodeRef.current;\n        if (!_node) return;\n        setNode({\n            ...node,\n            moving: true,\n            message: \"Start moving!\",\n            relativePosition: {\n                x: event.clientX - _node.offsetLeft,\n                y: event.clientY - _node.offsetTop,\n            }\n        });\n    }\n    function handleMouseMove(event: any) {\n        if (!node.moving) return;\n        setNode({\n            ...node,\n            moving: true,\n            message: \"Moving...\",\n            position: {\n                left: event.clientX - node.relativePosition.x + 'px',\n                top: event.clientY - node.relativePosition.y + 'px',\n            }\n        });\n    }\n    function handleMouseUp() {\n        setNode({\n            ...node,\n            message: \"Move me!\",\n            moving: false\n        });\n    }\n\n    return (\n        <>\n            <div className=\"move-node\" style={node.position}\n                onMouseDown={handleMouseDown}\n                onMouseMove={handleMouseMove}\n                onMouseUp={handleMouseUp}\n                ref={nodeRef}>\n                {node.message}\n            </div>\n        </>\n    );\n}\n\nexport default FunctionComponent;\n```\n\n## 14. React 的组件复用\n\n组件复用：为了一次声明多地使用，统一管理。\n\n```tsx\n// FunctionComponent.tsx\nfunction FunctionComponent(props: any) {\n\n    function handleChangeText() {\n        props.setText(\"Text has been changed!\");\n    }\n\n    return (\n        <>\n            <div>\n                <p>{props.text}</p>\n            </div>\n            <button onClick={handleChangeText}>Change Text</button>\n            <div>\n                first：{props.input1Html}\n            </div>\n            {props.children}\n            <div>\n                second：{props.input2Html(\"Input from FunctionComponent\")}\n            </div>\n        </>\n    );\n}\n\nexport default FunctionComponent;\n\n// App.tsx\nimport { useState } from 'react';\nimport './App.css'\nimport FunctionComponent from './components/FunctionComponent';\n\nfunction App() {\n\n  const [text, setText] = useState(\"Initial Text\");\n\n  let input1Html = <input type=\"text\" placeholder=\"Input 1 from App\" />;\n\n  function input2Html(placeholder: string) {\n    return <input type=\"text\" placeholder={placeholder} />;\n  }\n\n  return (\n    <>\n      <FunctionComponent text={text} setText={setText}\n        input1Html={input1Html} input2Html={input2Html}>\n        <span>App's html content</span>\n      </FunctionComponent>\n    </>\n  )\n}\n\nexport default App\n```\n\n## 15. React 的路由 router\n\nReact 路由：\n\n1. react-router-dom：应用在浏览器端运行的项目。\n2. react-router：应用在React服务端渲染。\n\nReact 路由相关概念：\n\n1. HashRouter/BrowserRouter：决定路由模式是hash模式还是history。\n2. Routes：页面显示容器。\n3. Route：定义具体的路径与页面。\n\n```shell\nnpm install react-router-dom\n```\n\n```css\n.nav {\n  display: flex;\n  flex-direction: row;\n  gap: 0 16px;\n}\n\n.nav-item {\n  text-decoration: none;\n  padding: 4px 12px;\n  color: black;\n  background-color: #dfdfdf;\n  border-radius: 4px;\n}\n\n.nav-item:hover {\n  background-color: #aeaeae;\n}\n\n.nav-item.active {\n  background-color: #aeaeae;\n}\n\n.main {\n  margin-top: 16px;\n}\n```\n\n```tsx\nimport './App.css'\nimport { BrowserRouter, Routes, Route, NavLink, Link } from 'react-router-dom';\nfunction App() {\n  let menu: any = [\n    {\n      path: '/',\n      name: 'home',\n    },\n    {\n      path: '/about',\n      name: 'about',\n    },\n    {\n      path: '/contact',\n      name: 'contact',\n    }\n  ];\n\n  return (\n    <>\n      <BrowserRouter>\n        <div className='nav'>\n          {\n            menu.map((item: any) => {\n              return (\n                // <NavLink className=\"nav-item\" key={item.path} to={item.path}>{item.name}</NavLink>\n                <NavLink className={(obj) => {\n                  // 是否激活判断\n                  return obj.isActive ? 'nav-item active' : 'nav-item'\n                }} key={item.path} to={item.path}>{item.name}</NavLink>\n              )\n            })\n          }\n        </div>\n        <main className='main'>\n          <Routes>\n            <Route path='/' element={<><div>Home Page</div><div><Link to='/about'>goto about</Link></div></>} />\n            <Route path='/about' element={<div>About Page</div>} />\n            <Route path='/contact' element={<div>Contact Page</div>} />\n          </Routes>\n        </main>\n      </BrowserRouter>\n    </>\n  )\n}\n\nexport default App\n```\n\n获取路由中的数据：\n\n1. 获取params：`useParams`（v6）/`this.props.match.params`（v5）\n2. 获取search：`useSearchParams`（v6）/`this.props.location.search`（v5）\n3. 获取params：`useLocation`（v6）/`this.props.location.state`（v5）\n\n路由JS跳转：`useNavigate`(v6)/`this.props.history.push()`(v5)\n\n路由嵌套：\n\n```css\n/* App.css */\n.nav {\n  display: flex;\n  flex-direction: row;\n  gap: 0 16px;\n}\n\n.nav-item {\n  text-decoration: none;\n  padding: 4px 12px;\n  font-size: 14px;\n  color: black;\n  background-color: #dfdfdf;\n  border-radius: 4px;\n}\n\n.nav-item:hover {\n  background-color: #aeaeae;\n}\n\n.nav-item.active {\n  background-color: #aeaeae;\n}\n\n.main {\n  margin-top: 16px;\n}\n```\n\n```tsx\n// Home.tsx\nfunction Home() {\n\n    return (\n        <>\n            <div>Home</div>\n        </>\n    )\n}\n\nexport default Home\n\n// Article.tsx\nfunction Article() {\n\n    return (\n        <>\n            <div>Article</div>\n        </>\n    )\n}\n\nexport default Article\n\n// About.tsx\nimport { Link, Outlet, useNavigate } from 'react-router-dom';\n\nfunction About(props: any) {\n    // 添加空值检查\n    const children = props?.children || [];\n\n    let navigate = useNavigate();\n\n    function handleGotoAboutWebsite() {\n        navigate(\"/about/website/1\" + \"?search=11&code=222\", {\n            state: { some: \"state\" },\n        });\n    }\n\n    return (\n        <div>\n            <div>About</div>\n            {children.map((item: any) => (\n                <div key={item.path}>\n                    <span>{item.path}</span>\n                    <Link to={item.path}>{item.title}</Link>\n                </div>\n            ))}\n            <button onClick={handleGotoAboutWebsite}>goto AboutWebsite</button>\n\n            {/* 使用 Outlet 组件来渲染子路由内容 */}\n            <Outlet />\n        </div>\n    );\n}\n\nexport default About;\n\n// AboutMe.tsx\nfunction AboutMe() {\n\n    return (\n        <>\n            <div>AboutMe</div>\n        </>\n    )\n}\n\nexport default AboutMe\n\n// AboutWebsite.tsx\nimport { useLocation, useParams, useSearchParams } from \"react-router-dom\"\n\nfunction AboutWebsite() {\n\n    let params = useParams()\n    console.log('params', params);\n    const [searchParams, setSearchParams] = useSearchParams();\n    console.log('searchParams', searchParams);\n    let location = useLocation()\n    console.log('location', location);\n\n\n    return (\n        <>\n            <div>AboutWebsite</div>\n        </>\n    )\n}\n\nexport default AboutWebsite\n```\n\n```tsx\n// router/index.tsx\nimport Home from '../pages/Home'\nimport About from '../pages/About'\nimport Article from '../pages/Article'\nimport AboutMe from '../pages/AboutMe'\nimport AboutWebsite from '../pages/AboutWebsite'\n\nconst router = [\n    {\n        id: 1,\n        path: '/',\n        title: '首页',\n        element: Home\n    },\n    {\n        id: 2,\n        path: '/article',\n        title: '文章',\n        element: Article\n    },\n    {\n        id: 3,\n        path: '/about',\n        title: '关于',\n        element: About,\n        children: [\n            {\n                id: 301,\n                path: 'me',\n                title: '关于我',\n                element: AboutMe,\n            },\n            {\n                id: 302,\n                path: 'website/:site',\n                title: '关于网站',\n                element: AboutWebsite,\n            }\n        ]\n    }\n]\n\nexport default router\n```\n\n```tsx\n// App.tsx\nimport './App.css'\nimport { BrowserRouter, Routes, Route, NavLink } from 'react-router-dom';\nimport router from './router';\n\nfunction App() {\n  return (\n    <>\n      <BrowserRouter>\n        <div className='nav'>\n          {\n            router.map((item: any) => {\n              return (\n                // <NavLink className=\"nav-item\" key={item.path} to={item.path}>{item.title}</NavLink>\n                <NavLink className={(obj) => {\n                  // 是否激活判断\n                  return obj.isActive ? 'nav-item active' : 'nav-item'\n                }} key={item.path} to={item.path}>{item.title}</NavLink>\n              )\n            })\n          }\n        </div>\n        <main className='main'>\n          <Routes>\n            {\n              router.map((item: any) => {\n                if (item.children && item.children.length > 0) {\n                  return (\n                    <Route key={item.path} path={item.path} element={<item.element children={item.children} />}>\n                      {item.children.map((child: any) => (\n                        <Route key={child.path} path={child.path} element={<child.element />} />\n                      ))}\n                    </Route>\n                  )\n                } else {\n                  return (\n                    <Route key={item.path} path={item.path} element={<item.element />} />\n                  )\n                }\n              })\n            }\n          </Routes>\n        </main>\n      </BrowserRouter>\n    </>\n  )\n}\n\nexport default App\n```\n\n## 16. React 的状态容器 Redux\n\n```shell\nnpm install redux\n```\n\nRedux 通用基础用法：（结合15节的路由进行使用）\n\n```ts\n// store/index.ts\nimport reducer from \"./reducer\";\nimport { createStore } from \"redux\";\nconst store = createStore(reducer);\nexport default store;\n\n// store/reducer.ts\nimport { combineReducers } from 'redux';\n\nfunction reducer1(state = false, action: any) {\n    switch (action.type) {\n        case 'Login':\n            state = action.status;\n            return state;\n        default:\n            return state;\n    }\n}\n\nfunction reducer2(state = 0, action: any) {\n    switch (action.type) {\n        case 'Add':\n            state += action.num;\n            return state;\n        case 'Sub':\n            state -= action.num;\n            return state;\n        default:\n            return state;\n    }\n}\n\nexport default combineReducers({\n    isLogin: reducer1,\n    count: reducer2\n});\n```\n\n```tsx\n// pages/Home.tsx\nimport { useEffect, useState } from \"react\";\nimport store from \"../store\";\nfunction Home() {\n\n    const [count, setCount] = useState(store.getState().count);\n    const [isLogin, setIsLogin] = useState(store.getState().isLogin);\n\n    useEffect(() => {\n        store.subscribe(() => {\n            setCount(store.getState().count);\n            setIsLogin(store.getState().isLogin);\n            console.log('store changed');\n        });\n    }, [])\n\n    console.log(store.getState())\n\n    function handleAddCount() {\n        store.dispatch({ type: 'Add', num: 1 });\n    }\n\n    function handleMinusCount() {\n        store.dispatch({ type: 'Sub', num: 1 });\n    }\n\n    function handleLogin() {\n        let _isLogin = isLogin;\n        _isLogin = !_isLogin;\n        store.dispatch({ type: 'Login', status: _isLogin });\n    }\n\n\n    return (\n        <>\n            <div>Home</div>\n            <div>Count: {count}</div>\n            <button onClick={handleAddCount}>Add Count</button>\n            <button onClick={handleMinusCount}>Minus Count</button>\n            <div>Login: {isLogin ? '已经登录' : '未登录'}</div>\n            <button onClick={handleLogin}>\n\t            {isLogin ? '退出登录' : '进行登录'}\n\t        </button>\n        </>\n    )\n}\n\nexport default Home\n\n// pages/Article.tsx\nimport store from \"../store\"\nfunction Article() {\n\n    return (\n        <>\n            <div>{store.getState().isLogin ? \"已经登录\" : \"暂未登录\"}</div>\n            <div>{\"current count is:\" + store.getState().count}</div>\n            <div>Article</div>\n        </>\n    )\n}\n\nexport default Article\n```\n\n针对React中使用Redux的组件库：\n\n```shell\nnpm install react-redux\n```\n\n```tsx\n// main.tsx\nimport { StrictMode } from 'react'\nimport { createRoot } from 'react-dom/client'\nimport './index.css'\nimport App from './App.tsx'\nimport { Provider } from 'react-redux'\nimport store from './store/index.ts'\n\ncreateRoot(document.getElementById('root')!).render(\n  <StrictMode>\n    <Provider store={store}>\n      <App />\n    </Provider>\n  </StrictMode>,\n)\n\n// pages/Home.tsx\nimport { connect } from \"react-redux\";\n\nfunction Home(props: any) {\n  console.log(props);\n  function handleAddCount() {\n    props.addCount(1);\n  }\n\n  function handleMinusCount() {\n    props.minusCount(1);\n  }\n\n  function handleLogin() {\n    props.login(!props.isLogin);\n  }\n\n  return (\n    <>\n      <div>Home</div>\n      <div>Count: {props.count}</div>\n      <button onClick={handleAddCount}>Add Count</button>\n      <button onClick={handleMinusCount}>Minus Count</button>\n      <div>Login: {props.isLogin ? \"已经登录\" : \"未登录\"}</div>\n      <button onClick={handleLogin}>\n        {props.isLogin ? \"退出登录\" : \"进行登录\"}\n      </button>\n    </>\n  );\n}\n\nconst mapStateToProps = (state: any) => {\n  return {\n    isLogin: state.isLogin,\n    count: state.count,\n  };\n};\n\nconst mapDispatchToProps = {\n  login(status: boolean) {\n    return {\n      type: \"Login\",\n      status: status,\n    };\n  },\n  addCount(num: number) {\n    return {\n      type: \"Add\",\n      num: num,\n    };\n  },\n  minusCount(num: number) {\n    return {\n      type: \"Sub\",\n      num: num,\n    };\n  },\n};\n\nexport default connect(mapStateToProps, mapDispatchToProps)(Home);\n```\n\nRedux 新版本声明和使用：\n\n```shell\nnpm install @reduxjs/toolkit\n```\n\n```ts\n// store/index.ts\nimport { isLoginReducer, countReducer } from \"./reducer\";\nimport { configureStore } from \"@reduxjs/toolkit\";\n\nconst store = configureStore({\n    reducer: {\n        isLogin: isLoginReducer.reducer,\n        count: countReducer.reducer,\n    },\n});\nexport default store;\n\n// store/reducer.ts\nimport { createSlice } from \"@reduxjs/toolkit\";\n\nexport const isLoginReducer = createSlice({\n  name: \"login\",\n  initialState: false,\n  reducers: {\n    setLogin: (state, action) => {\n      state = action.payload.status;\n      return state;\n    },\n  },\n});\n\nexport const countReducer = createSlice({\n  name: \"count\",\n  initialState: 0,\n  reducers: {\n    addCount: (state, action) => {\n      state += action.payload.num;\n      return state;\n    },\n    subCount: (state, action) => {\n      state -= action.payload.num;\n      return state;\n    },\n  },\n});\n\nexport const { setLogin } = isLoginReducer.actions;\nexport const { addCount, subCount } = countReducer.actions;\n```\n\n```tsx\n// main.tsx\nimport { StrictMode } from 'react'\nimport { createRoot } from 'react-dom/client'\nimport './index.css'\nimport App from './App.tsx'\nimport { Provider } from 'react-redux'\nimport store from './store/index.ts'\n\ncreateRoot(document.getElementById('root')!).render(\n  <StrictMode>\n    <Provider store={store}>\n      <App />\n    </Provider>\n  </StrictMode>,\n)\n\n// pages/Home.tsx\nimport { useSelector, useDispatch } from \"react-redux\";\nimport { setLogin, addCount, subCount } from \"../store/reducer\";\n\nfunction Home() {\n  const isLogin = useSelector((store: any) => store.isLogin);\n  const count = useSelector((store: any) => store.count);\n  const dispatch = useDispatch();\n\n  function handleAddCount() {\n    dispatch(addCount({ num: 1 }));\n  }\n\n  function handleMinusCount() {\n    dispatch(subCount({ num: 1 }));\n  }\n\n  function handleLogin() {\n    dispatch(setLogin({ status: !isLogin }));\n  }\n\n  return (\n    <>\n      <div>Home</div>\n      <div>Count: {count}</div>\n      <button onClick={handleAddCount}>Add Count</button>\n      <button onClick={handleMinusCount}>Minus Count</button>\n      <div>Login: {isLogin ? \"已经登录\" : \"未登录\"}</div>\n      <button onClick={handleLogin}>{isLogin ? \"退出登录\" : \"进行登录\"}</button>\n    </>\n  );\n}\n\nexport default Home;\n```\n\n## 17. React 渲染性能优化\n\n1. 数据只加载一次时或者仅仅只有某个属性发生变化后才进行调用时，使用 `useMemo()` 方法。\n2. 路由使用子组件所有属性都依赖于父组件时，可以集成 `React.PureComponent` 或者使用 `memo()` 方法。当传入子组件含有方法时，可以将方法通过 `useCallback()` 方法进行包裹。避免父组件重新渲染方法重新生成。","collection":"docs","data":{"title":"React 基础内容","description":"从组件与JSX、项目初始化、样式添加、state管理、列表渲染、条件渲染、生命周期、双向绑定、事件监听、计算属性、组件传值、动画效果、DOM操作到组件复用，全面覆盖React开发核心技能点","author":"Yumih","authorAvatar":"/coding-one-more-time/avatar.jpg","authorDescription":"7分技术，3分管理，2分运气","category":"前端框架","tags":["React","前端","基础内容"],"flag":null,"cover":null,"publishTime":"2025年11月07日","updateTime":"2025年11月13日","wordCount":3865,"readingTime":"约19分钟","chapter":"1"}}],"totalArticles":1,"totalWordCount":3865,"totalReadingTime":"约19分钟","category":"前端框架","tags":["React","前端","入门教程"],"flag":null,"author":"Yumih","authorAvatar":"/coding-one-more-time/avatar.jpg","authorDescription":"7分技术，3分管理，2分运气","publishTime":"2025年11月07日","updateTime":"202       categoryEl.className = 'group mr-1.5 rounded-xl px-2 py-0.5 h-6 text-xs font-medium';
      
      // 添加flagColors样式
      if (flagColors[category]) {
        categoryEl.classList.add(...flagColors[category].split(' '));
      } else {
        categoryEl.classList.add('bg-secondary', 'text-secondary-foreground');
      }
      
      if (hasPath) {
        categoryEl.innerHTML = `<a href="${categoriesPath}${category}" title="${category}" class="inline-flex gap-x-1 items-center h-5 cursor-pointer">${ICONS.TAG}<span>${category}</span></a>`;
      } else {
        categoryEl.innerHTML = `<span class="inline-flex gap-x-1 items-center h-5 cursor-default">${ICONS.TAG}<span>${category}</span></span>`;
      }
      
      return categoryEl;
    },

    createMoreTagsElement: (remainingCount, remainingTags) => {
      const moreEl = document.createElement('span');
      moreEl.className = 'group rounded-xl bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground';
      moreEl.innerHTML = `<span class="inline-flex gap-x-0.5 items-center h-5 cursor-pointer" title="${remainingTags.join("；")}">${ICONS.PLUS}<span>${remainingCount}</span></span>`;
      return moreEl;
    }
  };

  // 文档卡片创建函数
  const cardCreators = {
    setupCategory: (card, document) => {
      const categoryBadge = card.querySelector(".category-badge");
      const categoryText = card.querySelector(".category-text");
      
      if (document.category) {
        categoryText.textContent = document.category;
        
        // 添加flagColors样式
        if (flagColors[document.category]) {
          categoryBadge.classList.add(...flagColors[document.category].split(' '));
        }
        
        const hasCategoriesPath = categoriesPath && categoriesPath.trim() !== '';
        
        if (hasCategoriesPath) {
          const linkEl = categoryBadge.querySelector("a");
          linkEl.href = `${categoriesPath}${document.category}`;
          linkEl.classList.add('cursor-pointer');
        } else {
          const linkEl = categoryBadge.querySelector("a");
          const iconHtml = linkEl.querySelector("svg")?.outerHTML || '';
          linkEl.parentNode.innerHTML = `${iconHtml}<span class="category-text cursor-default">${document.category}</span>`;
        }
      } else {
        categoryBadge.style.display = "none";
      }
    },

    setupTags: (card, doc) => {
      const tagsContainer = card.querySelector(".tags-container");
      const hasTagsPath = tagsPath && tagsPath.trim() !== '';
      
      if (doc.tags && doc.tags.length > 0) {
        const displayTags = doc.tags.slice(0, CONSTANTS.TAGS_PER_CARD);
        
        displayTags.forEach(tag => {
          const badge = document.createElement('span');
          badge.className = 'group mr-2 rounded-xl px-2 py-0.5 h-6 text-xs font-medium';
          
          // 添加flagColors样式
          if (flagColors[tag]) {
            badge.classList.add(...flagColors[tag].split(' '));
          } else {
            badge.classList.add('bg-secondary', 'text-secondary-foreground');
          }
          
          if (hasTagsPath) {
            badge.innerHTML = `<a href="${tagsPath}${tag}" title="${tag}" class="inline-flex gap-x-1 items-center h-5 cursor-pointer">${ICONS.TAG}<span>${tag}</span></a>`;
          } else {
            badge.innerHTML = `<span class="inline-flex gap-x-1 items-center h-5 cursor-default" title="${tag}">${ICONS.TAG}<span>${tag}</span></span>`;
          }
          
          tagsContainer.appendChild(badge);
        });
        
        if (doc.tags.length > CONSTANTS.TAGS_PER_CARD) {
          const moreBadge = document.createElement('span');
          moreBadge.className = 'group rounded-xl bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground';
          moreBadge.innerHTML = `<span class="inline-flex gap-x-0.5 items-center h-5 cursor-pointer" title="${doc.tags.slice(CONSTANTS.TAGS_PER_CARD).join("；")}">${ICONS.PLUS}<span>${doc.tags.length - CONSTANTS.TAGS_PER_CARD}</span></span>`;
          tagsContainer.appendChild(moreBadge);
        }
      }
    },

    setupAuthor: (card, document) => {
      const authorInfo = card.querySelector(".author-info");
      const authorName = card.querySelector(".author-name");
      const authorAvatar = card.querySelector(".author-avatar img");
      const authorAvatarContainer = card.querySelector(".author-avatar");
      
      if (document.author) {
        authorName.textContent = document.author;
        
        // 设置作者信息的title属性
        if (document.authorDescription) {
          authorInfo.setAttribute("title", document.authorDescription);
        }
        
        if (document.authorAvatar) {
          authorAvatar.src = document.authorAvatar;
          authorAvatar.alt = document.author;
          authorAvatar.style.display = "block";
          authorAvatarContainer.style.backgroundColor = "transparent";
        } else {
          // 隐藏图片，使用文字头像
          authorAvatar.style.display = "none";
          
          // 创建文字头像
          const firstChar = document.author.charAt(0).toUpperCase();
          const colors = [
            { bg: '#F87171', text: '#FFFFFF' }, // 红色
            { bg: '#60A5FA', text: '#FFFFFF' }, // 蓝色
            { bg: '#34D399', text: '#FFFFFF' }, // 绿色
            { bg: '#FBBF24', text: '#FFFFFF' }, // 黄色
            { bg: '#A78BFA', text: '#FFFFFF' }, // 紫色
            { bg: '#F472B6', text: '#FFFFFF' }  // 粉色
          ];
          
          const colorIndex = firstChar.charCodeAt(0) % colors.length;
          const selectedColor = colors[colorIndex];
          
          authorAvatarContainer.style.backgroundColor = selectedColor.bg;
          authorAvatarContainer.style.color = selectedColor.text;
          authorAvatarContainer.style.display = "flex";
          authorAvatarContainer.style.alignItems = "center";
          authorAvatarContainer.style.justifyContent = "center";
          authorAvatarContainer.style.fontSize = "14px";
          authorAvatarContainer.style.fontWeight = "bold";
          
          // 先清空容器
          while (authorAvatarContainer.firstChild) {
            authorAvatarContainer.removeChild(authorAvatarContainer.firstChild);
          }
          
          authorAvatarContainer.appendChild(authorAvatar);
          authorAvatarContainer.appendChild(document.createTextNode(firstChar));
        }
      } else {
        authorInfo.style.display = "none";
      }
    },

    setupStats: (card, document) => {
      // 文章数量
      const articleCountText = card.querySelector(".article-count-text");
      const articleCountContainer = card.querySelector(".article-count-container");
      
      if (document.totalArticles) {
        articleCountText.textContent = utils.formatCount(document.totalArticles);
      } else {
        articleCountContainer.style.display = "none";
      }

      // 字数统计
      const wordCountText = card.querySelector(".word-count-text");
      const wordCountContainer = card.querySelector(".word-count-container");
      
      if (document.totalWordCount) {
        wordCountText.textContent = utils.formatCount(document.totalWordCount);
      } else {
        wordCountContainer.style.display = "none";
      }

      // 阅读时间
      const readingTimeText = card.querySelector(".reading-time-text");
      const readingTimeContainer = card.querySelector(".reading-time");
      
      if (document.totalReadingTime) {
        readingTimeText.textContent = document.totalReadingTime;
      } else {
        readingTimeContainer.style.display = "none";
      }
    },

    setupCover: (card, document) => {
      const coverImg = card.querySelector(".cover-image");
      
      if (document.cover) {
        coverImg.src = document.cover;
        coverImg.alt = document.title;
      } else {
        // 如果没有封面图，使用默认的背景色
        coverImg.style.display = "none";
        const coverContainer = card.querySelector(".cover-container");
        coverContainer.style.background = "linear-gradient(135deg, #667eea 0%, #764ba2 100%)";
      }
    },

    setupLinks: (card, document) => {
      const titleLink = card.querySelector(".title-link");
      const viewDetailsLink = card.querySelector(".view-details");
      
      // 使用 document.id 构建链接，与 BookList.astro 保持一致
      const documentUrl = `${basePath}${document.id}`;
      titleLink.href = documentUrl;
      viewDetailsLink.href = documentUrl;
      titleLink.title = document.title;
    },

    setupPublishDate: (card, document) => {
      const publishDateEl = card.querySelector(".publish-date");
      
      if (document.publishTime) {
        publishDateEl.textContent = document.publishTime;
      } else {
        publishDateEl.textContent = '';
      }
    },

    setupFlag: (card, document) => {
      const flagContainer = card.querySelector(".flag-container");
      const flagText = card.querySelector(".flag-text");
      const flagBadge = card.querySelector(".flag-container > *"); // 直接获取Badge元素
      
      if (document.flag && flagColors[document.flag]) {
        flagText.textContent = document.flag;
        if (flagBadge) {
          flagBadge.classList.add(...flagColors[document.flag].split(' '));
        }
        flagContainer.style.display = "block";
      } else {
        flagContainer.style.display = "none";
      }
    },

    setupTitleAndDescription: (card, document) => {
      const titleText = card.querySelector(".title-text");
      const descriptionText = card.querySelector(".description-text");
      const titleLink = card.querySelector(".title-link");
      
      titleText.textContent = document.title;
      descriptionText.textContent = document.description;
      titleLink.title = document.title;
      descriptionText.setAttribute("title", document.description);
    }
  };

  // 创建文档卡片
  const createDocumentCard = (doc) => {
    const template = document.getElementById("document-card-template");
    if (!template) {
      console.error("Document card template not found");
      return null;
    }
    
    const card = template.content.cloneNode(true);

    // 设置各个部分
    cardCreators.setupTitleAndDescription(card, doc);
    cardCreators.setupCategory(card, doc);
    cardCreators.setupTags(card, doc);
    cardCreators.setupAuthor(card, doc);
    cardCreators.setupStats(card, doc);
    cardCreators.setupCover(card, doc);
    cardCreators.setupLinks(card, doc);
    cardCreators.setupPublishDate(card, doc);
    cardCreators.setupFlag(card, doc);

    return card;
  };

  // 渲染函数
  const render = {
    emptyState: () => {
      return `
        <div class="text-center py-12">
          <div class="text-muted-foreground mb-4">
            ${ICONS.EMPTY}
            <p class="text-lg font-medium">暂无小册</p>
            <p class="text-sm">当前分类下还没有发布任何小册</p>
          </div>
        </div>
      `;
    },

    documents: (page = 1) => {
      if (!elements.documentsContainer) return;

      const tempContainer = document.createElement('div');
      tempContainer.className = 'document-list__content flex flex-col gap-4 lg:gap-6 mb-6';
      tempContainer.style.opacity = '0';
      tempContainer.style.transition = `opacity ${CONSTANTS.TRANSITION_DURATION}ms ease-in-out`;

      const startIndex = (page - 1) * documentsPerPage;
      const endIndex = startIndex + documentsPerPage;
      const currentDocuments = state.filteredDocuments.slice(startIndex, endIndex);

      if (currentDocuments.length === 0) {
        tempContainer.innerHTML = render.emptyState();
      } else {
        currentDocuments.forEach((doc) => {
          const card = createDocumentCard(doc);
          if (card) {
            tempContainer.appendChild(card);
          }
        });
      }

      elements.documentsContainer.style.opacity = '0';
      
      setTimeout(() => {
        elements.documentsContainer.innerHTML = tempContainer.innerHTML;
        
        setTimeout(() => {
          elements.documentsContainer.style.opacity = '1';
          utils.scrollToTop();
        }, CONSTANTS.SCROLL_DELAY);
      }, CONSTANTS.CONTENT_SWITCH_DELAY);

      updatePagination();
    }
  };

  // 渲染文档列表（兼容旧调用）
  const renderDocuments = () => {
    render.documents(state.currentPage);
  };

  // 更新分页控件
  const updatePagination = () => {
    const totalFiltered = state.filteredDocuments.length;
    const totalPages = Math.ceil(totalFiltered / documentsPerPage);

    if (elements.prevBtn) {
      elements.prevBtn.disabled = state.currentPage <= 1;
      updateButtonState(elements.prevBtn, elements.prevBtn.disabled);
    }

    if (elements.nextBtn) {
      elements.nextBtn.disabled = state.currentPage >= totalPages;
      updateButtonState(elements.nextBtn, elements.nextBtn.disabled);
    }

    if (elements.pageInfo) {
      elements.pageInfo.innerHTML = `第 ${state.currentPage}/${totalPages} 页`;
    }

    if (elements.totalCount) {
      elements.totalCount.textContent = totalFiltered;
    }

    if (elements.totalPagesEl) {
      elements.totalPagesEl.textContent = totalPages;
    }
  };

  // 更新按钮状态
  const updateButtonState = (btn, isDisabled) => {
    if (isDisabled) {
      btn.classList.add("opacity-50", "cursor-not-allowed");
      btn.classList.remove("hover:bg-primary/10", "hover:text-primary");
    } else {
      btn.classList.remove("opacity-50", "cursor-not-allowed");
      btn.classList.add("hover:bg-primary/10", "hover:text-primary");
    }
  };

  // 分类筛选
  const filterByCategory = (category) => {
    state.currentCategory = category;
    state.currentPage = 1;

    if (category === "all") {
      state.filteredDocuments = [...documentsData];
    } else {
      state.filteredDocuments = documentsData.filter((document) => {
        return document.category === category;
      });
    }

    render.documents(state.currentPage);
    utils.scrollToTop();
  };

  // 更新分类按钮状态
  const updateCategoryButtons = (activeCategory) => {
    const categoryButtons = document.querySelectorAll(".category-btn");
    categoryButtons.forEach((btn) => {
      const category = btn.getAttribute("data-category");
      const isActive = category === activeCategory;
      const hasColor = btn.getAttribute("data-has-color") === 'true';
      const categoryName = btn.getAttribute("data-category");
      
      if (isActive) {
        btn.setAttribute("data-active", "true");
        
        // 如果分类有对应的flagColors，应用动态颜色
        if (hasColor && flagColors[categoryName]) {
          // 移除默认的primary样式
          btn.classList.remove('data-[active=true]:bg-primary', 'data-[active=true]:text-primary-foreground');
          // 添加flagColors样式
          btn.classList.add(...flagColors[categoryName].split(' '));
          
          // 同时更新计数标签的样式
          const countBadge = btn.querySelector('.ml-auto');
          if (countBadge) {
            countBadge.classList.remove('bg-secondary', 'text-secondary-foreground');
            countBadge.classList.add('bg-primary-foreground', 'text-primary');
          }
        }
      } else {
        btn.removeAttribute("data-active");
        
        // 恢复默认样式
        if (hasColor && flagColors[categoryName]) {
          // 移除flagColors样式
          btn.classList.remove(...flagColors[categoryName].split(' '));
          // 恢复默认的primary样式
          btn.classList.add('data-[active=true]:bg-primary', 'data-[active=true]:text-primary-foreground');
          
          // 恢复计数标签的默认样式
          const countBadge = btn.querySelector('.ml-auto');
          if (countBadge) {
            countBadge.classList.remove('bg-primary-foreground', 'text-primary');
            countBadge.classList.add('bg-secondary', 'text-secondary-foreground');
          }
        }
      }
    });
  };

  // 事件处理函数
  const handlers = {
    handleCategoryClick: (e) => {
      const categoryBtn = e.target.closest(".category-btn");
      if (!categoryBtn) return;
      
      e.preventDefault();
      const category = categoryBtn.getAttribute("data-category");
      filterByCategory(category);
      updateCategoryButtons(category);
    },

    handlePagination: (e, direction) => {
      e.preventDefault();
      const totalPages = Math.ceil(state.filteredDocuments.length / documentsPerPage);
      
      if (direction === 'prev' && state.currentPage > 1) {
        state.currentPage--;
      } else if (direction === 'next' && state.currentPage < totalPages) {
        state.currentPage++;
      }
      
      renderDocuments();
      utils.scrollToTop();
    }
  };

  // 事件处理
  const setupEventListeners = () => {
    // 分类按钮点击事件（使用事件委托）
    document.addEventListener("click", handlers.handleCategoryClick);
    
    // 分页按钮点击事件
    if (elements.prevBtn) {
      elements.prevBtn.addEventListener("click", (e) => handlers.handlePagination(e, 'prev'));
    }
    
    if (elements.nextBtn) {
      elements.nextBtn.addEventListener("click", (e) => handlers.handlePagination(e, 'next'));
    }
  };

  // 初始化
  const init = () => {
    // 设置文档容器的初始过渡样式
    if (elements.documentsContainer) {
      elements.documentsContainer.style.transition = `opacity ${CONSTANTS.TRANSITION_DURATION}ms ease-in-out`;
      elements.documentsContainer.style.opacity = '1';
    }
    
    // 设置初始状态
    updateCategoryButtons("all");
    render.documents(state.currentPage);
    updatePagination();
    setupEventListeners();

    // 滚动容器优化
    const scrollContainer = document.getElementById("categories-scroll-container");
    if (scrollContainer) {
      scrollContainer.style.scrollBehavior = "smooth";
      
      const activeTag = scrollContainer.querySelector('[data-active="true"]');
      if (activeTag) {
        activeTag.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    }
  };

  // 页面加载完成后初始化
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();</script>  </div> <!-- 底部区域 --> <div class="mt-auto"> <div class="shrink-0 bg-border transition-colors duration-300 h-px w-full" aria-hidden="true"></div> <footer class="flex flex-col gap-1 text-sm text-muted-foreground tracking-wide container mx-auto py-2 footer layout" role="contentinfo"> <!-- 顶部区域：版权信息和运行时间 --> <div class="leading-6 flex justify-between flex-col items-center md:items-stretch md:flex-row"> <!-- 版权信息 --> <div class="flex gap-x-2"> <p>

  // 垂直菜单子菜单切换函数
  function toggleVerticalSubmenu(event, button) {
    // 阻止事件冒泡
    if (event?.stopPropagation) event.stopPropagation();
    if (!button) return;

    // 找到子菜单元素和图标
    const menuItem = button.closest("[data-menu-item]");
    const submenu = menuItem?.querySelector("[data-submenu]");
    if (!menuItem || !submenu) return;

    // 确定图标位置并检查当前状态
    const isButtonFullWidth = button.classList.contains("flex-1");
    const icon = isButtonFullWidth
      ? button.querySelector("svg:last-child")
      : button.querySelector("svg");
    const isOpen = submenu.classList.contains("max-h-0");

    // 执行展开或收起动画
    if (isOpen) {
      // 展开动画
      submenu.setAttribute("data-open", "true");

      // 延迟设置max-h和opacity以确保动画正确触发
      setTimeout(() => {
        submenu.classList.add("mt-1");

        // 延迟添加mt-1类使间距变化更自然
        setTimeout(() => {
          submenu.classList.remove("max-h-0", "opacity-0");
          submenu.classList.add("max-h-96", "opacity-100");
        }, 50);
      }, 10);

      // 旋转图标
      if (icon) icon.style.transform = "rotate(180deg)";
    } else {
      // 收起动画 - 先移除mt-1类
      submenu.classList.remove("mt-1");

      // 延迟执行其他收起动画，使间距变化更自然
      setTimeout(() => {
        submenu.classList.remove("max-h-96", "opacity-100");
        submenu.classList.add("max-h-0", "opacity-0");

        // 延迟设置data-open属性
        setTimeout(() => submenu.setAttribute("data-open", "false"), 150);
      }, 50);

      // 恢复图标位置
      if (icon) icon.style.transform = "rotate(0deg)";
    }
  }

  // 添加到window对象使全局可访问
  window.toggleVerticalSubmenu = toggleVerticalSubmenu;
</script>  </div> </div> </div> <script>(function(){const drawerId = "rightMenuDrawer";
const position = "right";
const open = false;
const onOpenChange = undefined;

  // 抽屉控制函数
  const drawer = document.getElementById(drawerId);
  const overlay = document.getElementById(`${drawerId}Overlay`);
  const content = document.getElementById(`${drawerId}Content`);
  const closeBtn = document.getElementById(
    `close${drawerId.charAt(0).toUpperCase() + drawerId.slice(1)}`
  );

  const drawerController = {
    open() {
      if (drawer && overlay && content) {
        drawer.classList.remove("pointer-events-none", "opacity-0");
        overlay.classList.remove("opacity-0");
        content.classList.remove(
          "translate-x-full",
          "-translate-x-full",
          "translate-y-full",
          "-translate-y-full"
        );
        document.body.style.overflow = "hidden";

        // 触发 onOpenChange 回调
        if (typeof onOpenChange === "function") {
          onOpenChange(true);
        }
      }
    },

    close() {
      if (drawer && overlay && content) {
        overlay.classList.add("opacity-0");

        // 根据位置类型应用正确的移出方向类
        if (position === "right") {
          content.classList.add("translate-x-full");
        } else if (position === "left") {
          content.classList.add("-translate-x-full");
        } else if (position === "top") {
          content.classList.add("-translate-y-full");
        } else if (position === "bottom") {
          content.classList.add("translate-y-full");
        }

        setTimeout(() => {
          drawer.classList.add("pointer-events-none", "opacity-0");
          document.body.style.overflow = "";

          // 触发 onOpenChange 回调
          if (typeof onOpenChange === "function") {
            onOpenChange(false);
          }
        }, 300);
      }
    },

    toggle() {
      if (content) {
        const isClosed =
          content.classList.contains("translate-x-full") ||
          content.classList.contains("-translate-x-full") ||
          content.classList.contains("translate-y-full") ||
          content.classList.contains("-translate-y-full");

        if (isClosed) {
          this.open();
        } else {
          this.close();
        }
      }
    },
  };

  // 将控制器挂载到全局对象，方便外部调用
  // 使用下划线替代连字符，确保是有效的JavaScript变量名
  const controllerName = `${drawerId}`.replace(/-/g, "_") + "Controller";
  window[controllerName] = drawerController;

  // 同时保留原始的控制器名，以便向后兼容
  window[`${drawerId}Controller`] = drawerController;

  // 初始化事件监听
  document.addEventListener("DOMContentLoaded", () => {
    // 初始化显示状态
    if (open) {
      drawerController.open();
    } else {
      drawerController.close();
    }

    // 绑定关闭按钮事件
    if (closeBtn) {
      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        drawerController.close();
      });
    }

    // 绑定遮罩层点击事件
    if (overlay) {
      overlay.addEventListener("click", () => {
        drawerController.close();
      });
    }

    // ESC关闭
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const isOpen =
          content &&
          !(
            content.classList.contains("translate-x-full") ||
            content.classList.contains("-translate-x-full") ||
            content.classList.contains("translate-y-full") ||
            content.classList.contains("-translate-y-full")
          );

        if (isOpen) {
          drawerController.close();
        }
      }
    });
  });
})();</script> <script>(function(){const drawerId = "rightMenuDrawer";
