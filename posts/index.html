  // 垂直菜单子菜单切换函数
  function toggleVerticalSubmenu(event, button) {
    // 阻止事件冒泡

    if (!button) return;

    // 找到子菜单元素和图标
    const menuItem = button.closest("[data-menu-item]");

    // 确定图标位置并检查当前状态
    const isButtonFullWidth = button.classList.contains("flex-1");
    const icon = isButtonFullWidth

    const isOpen = submenu.classList.contains("max-h-0");

    // 执行展开或收起动画

      // 展开动画

        setTimeout(() => submenu.setAttribute("data-open", "false"), 150);

    }

  // 搜索模态框控制

        modal.setAttribute("data-open", "true");

        // 聚焦到搜索输入框
        setTimeout(() => {
          const searchInput = modal.querySelector('input[type="search"]');
          if (searchInput) {
            searchInput.focus();

        }, 150);
      }
    },
    isOpen: function () {
      const modal = document.getElementById("search-modal");
      return modal && modal.getAttribute("data-open") === "true";
    },
    close: function () {
      const modal = document.getElementById("search-modal");
      if (modal) {
        modal.setAttribute("data-open", "false");

        // 可选：在动画完成后重置焦点
        setTimeout(() => {
          const searchButton = document.querySelector(
            '[onclick="openSearchModal()"]'
          );
          if (searchButton) {
            searchButton.focus();
          }
        }, 200);
      }
    },
  };

  // 关闭搜索模态框
  window.closeSearchModal = function () {
    window.searchModalController.close();
  };

  // ESC键关闭模态框
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      const modal = document.getElementById("search-modal");
      if (modal && modal.getAttribute("data-open") === "true") {
        window.searchModalController.close();
      }
    }
  });

  // 点击背景关闭模态框
  document.addEventListener("click", function (event) {
    const modal = document.getElementById("search-modal");
    if (
      modal &&
      event.target === modal &&
      modal.getAttribute("data-open") === "true"
    ) {
      window.searchModalController.close();
    }
  });

  // 动态检测搜索结果抽屉是否需要滚动条
  function updateDrawerScrollbar() {
    const drawer = document.querySelector(
      ".pagefind-ui-modal .pagefind-ui__drawer"
    );
    if (drawer) {
      const needsScrollbar = drawer.scrollHeight > drawer.clientHeight;
      if (needsScrollbar) {
        drawer.classList.add("has-scrollbar");
      } else {
        drawer.classList.remove("has-scrollbar");
      }
    }
  }

  // 处理mark标签中的空格
  function processMarkTags() {
    const marks = document.querySelectorAll(
      ".pagefind-ui-modal .pagefind-ui__result-excerpt mark"
    );
    marks.forEach((mark) => {
      // 获取原始文本并去除前后空格
      const originalText = mark.textContent || "";
      const trimmedText = originalText.trim();

      // 如果文本有变化，更新内容
      if (originalText !== trimmedText) {
        mark.textContent = trimmedText;
      }

      // 同时处理内部的多个连续空格
      const normalizedText = trimmedText.replace(/\s+/g, " ");
      if (trimmedText !== normalizedText) {
        mark.textContent = normalizedText;
      }
    });
  }

  // 监听搜索结果变化
  const observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (mutation) {
      if (mutation.type === "childList") {
        updateDrawerScrollbar();
        // 处理mark标签中的空格
        processMarkTags();
      }
    });
  });

  // 修改搜索输入框的placeholder文本
  function updateSearchPlaceholder() {
    const searchInput = document.querySelector(
      ".pagefind-ui-modal .pagefind-ui__search-input"
    );
    if (searchInput) {
      searchInput.placeholder = "搜索文章、小册、随笔..."; // 自定义placeholder文本
    }
  }

  // 当搜索模态框打开时开始监听
  const originalOpen = window.searchModalController.open;
  window.searchModalController.open = function () {
    originalOpen();

    // 立即更新搜索输入框placeholder
    updateSearchPlaceholder();

    setTimeout(function () {
      const drawer = document.querySelector(
        ".pagefind-ui-modal .pagefind-ui__drawer"
      );
      if (drawer) {
        updateDrawerScrollbar();
        // 初始处理mark标签
        processMarkTags();
        observer.observe(drawer, { childList: true, subtree: true });
      }
    }, 300);
  };

  // 当搜索模态框关闭时停止监听
  const originalClose = window.searchModalController.close;
  window.searchModalController.close = function () {
    observer.disconnect();
    originalClose();
  };

  // 监听搜索输入，实时处理mark标签
  document.addEventListener("input", function (event) {
    if (event.target.matches('.pagefind-ui-modal input[type="search"]')) {
      // 延迟处理，等待搜索结果更新
      setTimeout(processMarkTags, 100);
    }
  });

  (function () {
    const savedTheme = localStorage.getItem("theme");
    const prefersDark = window.matchMedia(
      "(prefers-color-scheme: dark)"

    if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");

  // 切换主题
  function toggleTheme() {
    if (typeof window === "undefined") return;

    const isDark = document.documentElement.classList.contains("dark");

    if (isDark) {
      document.documentElement.classList.remove("dark");
      localStorage.setItem("theme", "light");
    } else {
      document.documentElement.classList.add("dark");
      localStorage.setItem("theme", "dark");
    }
  }

  // 布局宽度管理 - 初始化与切换（防闪烁优化）
  (function () {
    const LAYOUT_KEY = "layoutWidth";
    const WIDE_CLASS = "w-full";
    const NARROW_CLASS = "container";

    // 预初始化：在DOM解析阶段应用保存的设置
    function preInitLayoutWidth() {
      const saved = localStorage.getItem(LAYOUT_KEY);
      if (saved === "wide") {
        // 使用CSSOM直接操作，避免重绘
        const style = document.createElement("style");
        style.textContent =
          ".layout { width: 100% !important; max-width: none !important; }";
        style.id = "layout-preinit";
        document.head.appendChild(style);
      }
    }

    // 应用布局宽度到所有元素
    function applyLayoutWidth(isWide) {
      // 移除预初始化样式
      const preinitStyle = document.getElementById("layout-preinit");
      if (preinitStyle) preinitStyle.remove();

      document.querySelectorAll(".layout").forEach((el) => {
        el.classList.toggle(WIDE_CLASS, isWide);
        el.classList.toggle(NARROW_CLASS, !isWide);
      });
    }

    // 初始化布局宽度
    function initLayoutWidth() {
      const saved = localStorage.getItem(LAYOUT_KEY);
      if (saved === "wide") applyLayoutWidth(true);
    }

    // 切换布局宽度
    window.toggleLayoutWidth = function () {
      const current = localStorage.getItem(LAYOUT_KEY) === "wide";
      const next = !current;

      applyLayoutWidth(next);
      localStorage.setItem(LAYOUT_KEY, next ? "wide" : "narrow");

      // 验证修正（防抖）
      clearTimeout(window._layoutVerifyTimer);
      window._layoutVerifyTimer = setTimeout(() => {
        const shouldBeWide = localStorage.getItem(LAYOUT_KEY) === "wide";
        document.querySelectorAll(".layout").forEach((el) => {
          const isWide = el.classList.contains(WIDE_CLASS);
          if (shouldBeWide !== isWide) {
            el.classList.toggle(WIDE_CLASS, shouldBeWide);
            el.classList.toggle(NARROW_CLASS, !shouldBeWide);
          }
        });
      }, 50);
    };

    // 预初始化（在DOM解析阶段执行）
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", preInitLayoutWidth);
    } else {
      preInitLayoutWidth();
    }

    // 完整初始化（DOM就绪后）
    if (document.readyState === "loading") {

<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right transition-transform duration-300 group-hover/link:translate-x-0.5"> <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>  </svg> <span class="absolute left-0 bottom-0 w-0 h-[1px] bg-primary transition-all duration-300 group-hover/link:w-full"></span> </a> </div> </div> </div> </div> </div> </article> </template> <script>(function(){const postsData = [{"id":"通过 Github 自动部署构建 Pages 页面.md","slug":"通过-github-自动部署构建-pages-页面","body":"## 引言\n\n在默认模式下，GitHub Pages 只能读取公开仓库的静态文件，这就意味着如果想用 Pages 做演示，就必须要要包源码一并公开。\n\n为了让源码继续留在私有仓库受保护，同时又能自动把构建产物发布到公开 Pages，我们可以借助 GitHub Actions，即私有仓库负责源码存储与构建 -> Actions 自动 push 产物到公开仓库 -> 公开仓库仅仅做 Pages 托管。这样既能保持源代码私有化，又能享受 GitHub 免费的静态站点服务，实现源码与部署完全分离。\n\n**下面按顺序给出 5 步可落地操作，15 分钟即可跑通整条链路。**\n\n## 步骤1：准备两个仓库\n\nGitHub 右上方菜单 -> Create new... -> New repository，创建一个私有仓库和一个公开仓库。\n\n![](assets/image-20251103233335.png)\n\n## 步骤2：创建 Personal access tokens (classic)\n\nGitHub 右上角头像 -> Settings -> Developer settings -> Personal access tokens -> Tokens (classic) -> Generate new token -> Generate new token (classic)，创建一个 personal access token (classic)。\n\n**注意**：这个 Token 生成后，只在第一次可见，之后就不可见了，一定要要保存好。格式：`ghp_xxxx`。\n\n![](assets/image-20251104201522.png)\n\n## 步骤3：将申请的 Token 存入到私有仓库的 Secrets 中\n\n进入私有仓库 -> Settings -> Secrets and variables → Actions → New repository secret，Name 填 `PUBLIC_REPO_TOKEN`，Value 贴刚才的申请的 Token 值。\n\n**注意**：Name 可自定义，但需要和下面 Actions 的 personal_token 这个名称保持一致。\n\n![](assets/image-20251104202326.png)\n\n## 步骤4：在私有仓库中新建 Actions 工作流\n\n在私有仓库中创建 `.github/workflows/deploy.yml` 文件，内容示例（以 Astro 为例）：\n\n```yaml\nname: your-action-deploy-name\n\non:\n  push:\n    branches:\n      - main\n\njobs:\n  build-and-deploy:\n    runs-on: ubuntu-latest\n\n    steps:\n      - name: Checkout private repo\n        uses: actions/checkout@v4\n\n      - name: Setup Node.js\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22.14.0\n\n      - name: Install pnpm\n        uses: pnpm/action-setup@v2\n        with:\n          version: 8\n\n      - name: Install dependencies\n        run: pnpm install\n\n      - name: Build Astro project\n        run: pnpm run build\n\n      # 构建结果推送至公开仓库\n      - name: Deploy to public repo \n        uses: peaceiris/actions-gh-pages@v3\n        with:\n          personal_token: ${{ secrets.PUBLIC_REPO_TOKEN }}\n          # 公开仓库的项目名称\n          external_repository: your-github-name/your-public-repository\n          publish_branch: gh-pages\n          publish_dir: ./dist\n          force_orphan: true\n```\n\n**核心推送关键**：\n\n```yaml\n# 构建结果推送至公开仓库\n- name: Deploy to public repo \n  uses: peaceiris/actions-gh-pages@v3\n  with:\n    # 配置到私有仓库密钥的名称 PUBLIC_REPO_TOKEN\n    personal_token: ${{ secrets.PUBLIC_REPO_TOKEN }}\n    # 公开仓库的项目名称\n    external_repository: your-github-name/your-public-repository\n    # 公开仓库的项目分支 gh-pages\n    publish_branch: gh-pages\n    # 推送dist目录下所有内容\n    publish_dir: ./dist\n    # 强制全新的 commit 覆盖分支的所有内容；true：历史全部丢弃\n    force_orphan: true\n```\n\n## 步骤5：公开仓库开启 GitHub Pages\n\n公开仓库 -> Code 创建 gh-pages 分支 -> Settings -> Pages -> 设置访问页面分支。\n\n**注意**：可在 Custom domain 自定义域名，自定义时别忘记添加域名解析 CNAME 记录。\n\n![](assets/image-20251104202656.png)\n\n## 步骤6：搭建完成，流程启动\n\n流程执行过程：\n\n1. 本地调整代码 -> push 到私有仓库。\n2. 私有仓库 Actions 自动构建 -> 把静态文件推送到公开仓库。\n3. GitHub Pages 自动更新，线上立即生效。\n\n全程保证源码始终在私有仓库中存储，公开仓库只有编译后的文件，无历史记录，达到“源码私有 + 站点公开”的目的。\n\n## 常见问题\n\n### 1. 权限报错 403\n\n> 检查 Token 是否对 `public_repo` 有读写权限。仓库路径是否有错误。\n\n### 2. Pages 404\n\n> 确认公开仓库是否开启 Pages，选择的分支与私有仓库 workflow 推送的是否一致；产物目录是否包含 index.html。\n\n### 3. 保留历史 commit\n\n> 将 `force_orphan:ture` 改为 `force_orphan:false`，公开仓库会带 commit 记录。\n\n**核心改造点**：\n\n```yaml\n- uses: peaceiris/actions-gh-pages@v3\n  with:\n\t# 其他配置...\n    # 保留完整 Git 历史\n    force_orphan: false\n    # 可选：沿用源码仓库的 commit msg\n    commit_message: ${{ github.event.head_commit.message }}\n```\n\n### 4. 慢构建/内存溢出 \n\n> 加 `NODE_OPTIONS: --max-old-space-size=8`，或换 `runs-on: ubuntu-latest-4-cores`\n\n**注意**：`runs-on: ubuntu-latest-4-cores` 属于 GitHub 的付费功能，仅在 Team 或 Enterprise 云计划中可用。免费用户只能使用 `runs-on: ubuntu-latest`（2 核 7 GB）。\n\n**`NODE_OPTIONS` 改造示例**：\n\n```yaml\n- name: Build Astro project\n  env:\n    # 8 GB，可再提高到 16384\n    NODE_OPTIONS: --max-old-space-size=8192\n  run: pnpm run build\n```\n\n**`runs-on` 改造示例**：\n\n```yaml\njobs:\n  build-and-deploy:\n    # GitHub 官方 4 核 16 GB 机型\n    runs-on: ubuntu-latest-4-cores\n```","collection":"posts","data":{"title":"通过 Github 自动部署构建 Pages 页面","description":"通过 GitHub Actions 打通「私有源码仓库 → 公开仓库 Pages」的自动部署链路，让代码私有、站点公开，一键发布。","author":"Yumih","authorAvatar":"/coding-one-more-time/avatar.jpg","authorDescription":"7分技术，3分管理，2分运气","category":"CI/CD","tags":["Github","自动部署","CD"],"flag":null,"chapter":null,"cover":"/coding-one-more-time/cover/github_auto_deploy.webp","publishTime":"2025年10月31日","updateTime":"2025年11月04日","wordCount":1066,"readingTime":"约5分钟"}}];

  // 图标SVG常量
  const ICONS = {

  // 状态管理
  const state = {
    filteredPosts: [...postsData],
    currentCategory: "all",

  // DOM元素缓存
  const elements = {
    postsContainer: document.getElementById("posts-container"),
    prevBtn: document.getElementById("prevPage"),
    nextBtn: document.getElementById("nextPage"),
    pageInfo: document.getElementById("pageInfo"),
    totalCount: document.getElementById("total-count"),
    totalPagesEl: document.getElementById("total-pages")
  };

  // 工具函数
  const utils = {
    formatCount: (n) => {
      if (n < 1_000) return String(n);
      if (n < 10_000) return (n / 1_000).toFixed(1).replace(/\.0$/, '') + 'k';
      if (n < 1_000_000) return (n / 10_000).toFixed(1).replace(/\.0$/, '') + 'w';
      if (n < 1_000_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'm';
      if (n < 1_000_000_000_000) return (n / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + 'b';
      return '999.9t+';
    },

    estimateWordCount: (description, wordCount) => {
      if (wordCount !== undefined && wordCount > 0) return wordCount;
      if (description) return Math.round(description.length * CONSTANTS.DESCRIPTION_WORD_RATIO);
      return 0;
    },

    estimateReadingTime: (wordCount) => {
      const minutes = Math.max(1, Math.round(wordCount / CONSTANTS.WORDS_PER_MINUTE));
      return `${minutes} 分钟`;
    },

    scrollToTop: () => {
      const scrollContainer = document.getElementById('content-container');
      const target = scrollContainer || window;
      target.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  // 分类处理函数
  const categoryHandlers = {
    createCategoryElement: (category, hasPath) => {
      const categoryEl = document.createElement('span');
      categoryEl.className = 'group mr-1.5 rounded-xl px-2 py-0.5 h-6 text-xs font-medium';
      
      // 添加flagColors样式
      if (flagColors[category]) {
        categoryEl.classList.add(...flagColors[category].split(' '));
      } else {
        categoryEl.classList.add('bg-secondary', 'text-secondary-foreground');
      }
      
      if (hasPath) {
        categoryEl.innerHTML = `<a href="${categoriesPath}${category}" title="${category}" class="inline-flex gap-x-1 items-center h-5 cursor-pointer">${ICONS.TAG}${category}</a>`;
      } else {
        categoryEl.innerHTML = `<span class="inline-flex gap-x-1 items-center h-5 cursor-default">${ICONS.TAG}${category}</span>`;
      }
      
      return categoryEl;
    },

    createMoreTagsElement: (remainingCount) => {
      const moreEl = document.createElement('span');
      moreEl.className = 'group rounded-xl bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground';
      moreEl.innerHTML = `<span class="inline-flex gap-x-0.5 items-center h-5 cursor-pointer" title="剩余 ${remainingCount} 个标签">${ICONS.PLUS}<span>${remainingCount}</span></span>`;
      return moreEl;
    }
  };

  // 文章卡片创建函数
  const cardCreators = {
    setupCategory: (card, post) => {
      const categoryBadge = card.querySelector(".category-badge");
      const categoryText = card.querySelector(".category-text");
      
      if (post.data.category) {
        categoryText.textContent = post.data.category;
        
        // 添加flagColors样式
        if (flagColors[post.data.category]) {
          categoryBadge.classList.add(...flagColors[post.data.category].split(' '));
        }
        
        const hasCategoriesPath = categoriesPath && categoriesPath.trim() !== '';
        
        if (hasCategoriesPath) {
          const linkEl = categoryBadge.querySelector("a");
          linkEl.href = `${categoriesPath}${post.data.category}`;
          linkEl.classList.add('cursor-pointer');
        } else {
          const linkEl = categoryBadge.querySelector("a");
          const iconHtml = linkEl.querySelector("svg")?.outerHTML || '';
          linkEl.parentNode.innerHTML = `${iconHtml}<span class="category-text cursor-default">${post.data.category}</span>`;
        }
      } else {
        categoryBadge.style.display = "none";
      }
    },

    setupTags: (card, post) => {
      const tagsContainer = card.querySelector(".tags-container");
      const hasTagsPath = tagsPath && tagsPath.trim() !== '';
      
      if (post.data.tags && post.data.tags.length > 0) {
        const displayTags = post.data.tags.slice(0, CONSTANTS.TAGS_PER_CARD);
        
        displayTags.forEach(tag => {
          const badge = document.createElement('span');
          badge.className = 'group mr-2 rounded-xl px-2 py-0.5 h-6 text-xs font-medium';
          
          // 添加flagColors样式
          if (flagColors[tag]) {
            badge.classList.add(...flagColors[tag].split(' '));
          } else {
            badge.classList.add('bg-secondary', 'text-secondary-foreground');
          }
          
          if (hasTagsPath) {
            badge.innerHTML = `<a href="${tagsPath}${tag}" title="${tag}" class="inline-flex gap-x-1 items-center h-5 cursor-pointer">${ICONS.TAG}<span>${tag}</span></a>`;
          } else {
            badge.innerHTML = `<span class="inline-flex gap-x-1 items-center h-5 cursor-default" title="${tag}">${ICONS.TAG}<span>${tag}</span></span>`;
          }
          
          tagsContainer.appendChild(badge);
        });
        
        if (post.data.tags.length > CONSTANTS.TAGS_PER_CARD) {
          const moreBadge = document.createElement('span');
          moreBadge.className = 'group rounded-xl bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground';
          moreBadge.innerHTML = `<span class="inline-flex gap-x-0.5 items-center h-5 cursor-pointer" title="${post.data.tags.slice(CONSTANTS.TAGS_PER_CARD).join("；")}">${ICONS.PLUS}<span>${post.data.tags.length - CONSTANTS.TAGS_PER_CARD}</span></span>`;
          tagsContainer.appendChild(moreBadge);
        }
      }
    },

    setupAuthor: (card, post) => {
      const authorInfo = card.querySelector(".author-info");
      const authorName = card.querySelector(".author-name");
      const authorAvatar = card.querySelector(".author-avatar img");
      
      if (post.data.author) {
        authorName.textContent = post.data.author;
        authorAvatar.src = post.data.authorAvatar || CONSTANTS.DEFAULT_AVATAR;
        authorAvatar.alt = post.data.author;
      } else {
        authorInfo.style.display = "none";
      }
    },

    setupStats: (card, post) => {
      const wordCount = utils.estimateWordCount(post.data.description, post.data.wordCount);
      const readingTime = post.data.readingTime || utils.estimateReadingTime(wordCount);
      
      card.querySelector(".word-count-text").textContent = utils.formatCount(wordCount);
      card.querySelector(".reading-time-text").textContent = readingTime;
    },

    setupCover: (card, post) => {
      const coverImage = card.querySelector(".cover-image");
      const coverContainer = card.querySelector(".cover-container");
      const titleText = post.data.title || post.slug;
      
      if (post.data.cover) {
        coverImage.src = post.data.cover;
        coverImage.alt = titleText;
        coverContainer.style.display = "block";
      } else {
        coverContainer.style.display = "none";
      }
    },

    setupLinks: (card, post) => {
      const titleLink = card.querySelector(".title-link");
      const viewDetailsLink = card.querySelector(".view-details");
      const titleText = post.data.title || post.slug;
      
      titleLink.href = `${basePath}${post.slug}`;
      titleLink.title = titleText;
      viewDetailsLink.href = `${basePath}${post.slug}`;
    },

    setupFlag: (card, post) => {
      const flagContainer = card.querySelector(".flag-container");
      const flagText = card.querySelector(".flag-text");
      const flagBadge = card.querySelector(".flag-container > *"); // Target the Badge element directly
      
      if (post.data.flag && flagColors[post.data.flag]) {
        flagText.textContent = post.data.flag;
        if (flagBadge) {
          flagBadge.classList.add(...flagColors[post.data.flag].split(' '));
        }
        flagContainer.style.display = "block";
      } else {
        flagContainer.style.display = "none";
      }
    }
  };

  // 主创建函数
  function createBlogCard(post) {
    const template = document.getElementById("blog-card-template");
    const card = template.content.cloneNode(true);
    const titleText = post.data.title || post.slug;

    // 设置基本信息
    card.querySelector(".publish-date").textContent = post.data.publishTime;
    card.querySelector(".description-text").textContent = post.data.description;
    
    // 设置描述和作者信息的title属性
    if (post.data.description) {
      card.querySelector(".description-text").setAttribute("title", post.data.description);
    }
    if (post.data.authorDescription) {
      card.querySelector(".author-info").setAttribute("title", post.data.authorDescription);
    }
    
    // 设置标题和链接
    const titleLink = card.querySelector(".title-link");
    titleLink.href = `${basePath}${post.slug}`;
    titleLink.title = titleText;
    card.querySelector(".title-text").textContent = titleText;
    
    // 设置分类、标签、作者、统计信息、封面图、旗帜
    cardCreators.setupCategory(card, post);
    cardCreators.setupTags(card, post);
    cardCreators.setupAuthor(card, post);
    cardCreators.setupStats(card, post);
    cardCreators.setupCover(card, post);
    cardCreators.setupLinks(card, post);
    cardCreators.setupFlag(card, post);

    return card;
  }

  // 渲染函数
  const render = {
    emptyState: () => {
      return `
        <div class="text-center py-12">
          <div class="text-muted-foreground mb-4">
            ${ICONS.EMPTY}
            <p class="text-lg font-medium">暂无文章</p>
            <p class="text-sm">当前分类下还没有发布任何文章</p>
          </div>
        </div>
      `;
    },

    posts: (page = 1) => {
      if (!elements.postsContainer) return;

      const tempContainer = document.createElement('div');
      tempContainer.className = 'blog1__content flex flex-col gap-4 lg:gap-6 mb-6';
      tempContainer.style.opacity = '0';
      tempContainer.style.transition = `opacity ${CONSTANTS.TRANSITION_DURATION}ms ease-in-out`;

      const startIndex = (page - 1) * postsPerPage;
      const endIndex = startIndex + postsPerPage;
      const currentPosts = state.filteredPosts.slice(startIndex, endIndex);

      if (currentPosts.length === 0) {
        tempContainer.innerHTML = render.emptyState();
      } else {
        currentPosts.forEach(post => {
          tempContainer.appendChild(createBlogCard(post));
        });
      }

      elements.postsContainer.style.opacity = '0';
      
      setTimeout(() => {
        elements.postsContainer.innerHTML = tempContainer.innerHTML;
        
        setTimeout(() => {
          elements.postsContainer.style.opacity = '1';
          utils.scrollToTop();
        }, CONSTANTS.SCROLL_DELAY);
      }, CONSTANTS.CONTENT_SWITCH_DELAY);

      render.pagination();
    },

    pagination: () => {
      if (!elements.prevBtn || !elements.nextBtn || !elements.pageInfo || !elements.totalCount || !elements.totalPagesEl) return;

      const totalFilteredPages = Math.ceil(state.filteredPosts.length / postsPerPage);

      elements.pageInfo.textContent = `第 ${state.currentPage}/${totalFilteredPages} 页`;
      elements.totalCount.textContent = state.filteredPosts.length;
      elements.totalPagesEl.textContent = totalFilteredPages;

      elements.prevBtn.disabled = state.currentPage <= 1;
      elements.nextBtn.disabled = state.currentPage >= totalFilteredPages;

      const updateButtonState = (btn, isDisabled) => {
        if (isDisabled) {
          btn.classList.add("opacity-50", "cursor-not-allowed");
          btn.classList.remove("hover:bg-primary/10", "hover:text-primary");
        } else {
          btn.classList.remove("opacity-50", "cursor-not-allowed");
          btn.classList.add("hover:bg-primary/10", "hover:text-primary");
        }
      };

      updateButtonState(elements.prevBtn, elements.prevBtn.disabled);
      updateButtonState(elements.nextBtn, elements.nextBtn.disabled);
    }
  };

  // 事件处理函数
  const handlers = {
    filterByCategory: (category) => {
      state.currentCategory = category;
      state.currentPage = 1;

      if (category === "all") {
        state.filteredPosts = [...postsData];
      } else {
        state.filteredPosts = postsData.filter(post => post.data.category === category);
      }

      render.posts(state.currentPage);
    },

    updateCategoryButtons: (category) => {
      const categoryButtons = document.querySelectorAll(".category-btn");
      categoryButtons.forEach(btn => {
        const isActive = btn.getAttribute("data-category") === category;
        const hasColor = btn.getAttribute("data-has-color") === 'true';
        const categoryName = btn.getAttribute("data-category");
        
        if (isActive) {
          btn.setAttribute("data-active", "true");
          
          // 如果分类有对应的flagColors，应用动态颜色
          if (hasColor && flagColors[categoryName]) {
            // 移除默认的primary样式
            btn.classList.remove('data-[active=true]:bg-primary', 'data-[active=true]:text-primary-foreground');
            // 添加flagColors样式
            btn.classList.add(...flagColors[categoryName].split(' '));
            
            // 同时更新计数标签的样式
            const countBadge = btn.querySelector('.ml-auto');
            if (countBadge) {
              countBadge.classList.remove('bg-secondary', 'text-secondary-foreground');
              countBadge.classList.add('bg-primary-foreground', 'text-primary');
            }
          }
        } else {
          btn.removeAttribute("data-active");
          
          // 恢复默认样式
          if (hasColor && flagColors[categoryName]) {
            // 移除flagColors样式
            btn.classList.remove(...flagColors[categoryName].split(' '));
            // 恢复默认的primary样式
            btn.classList.add('data-[active=true]:bg-primary', 'data-[active=true]:text-primary-foreground');
            
            // 恢复计数标签的默认样式
            const countBadge = btn.querySelector('.ml-auto');
            if (countBadge) {
              countBadge.classList.remove('bg-primary-foreground', 'text-primary');
              countBadge.classList.add('bg-secondary', 'text-secondary-foreground');
            }
          }
        }
      });
    },

    handleCategoryClick: (e) => {
      const categoryBtn = e.target.closest(".category-btn");
      if (!categoryBtn) return;
      
      e.preventDefault();
      const category = categoryBtn.getAttribute("data-category");
      handlers.filterByCategory(category);
      handlers.updateCategoryButtons(category);
    },

    handlePagination: (e, direction) => {
      e.preventDefault();
      const totalFilteredPages = Math.ceil(state.filteredPosts.length / postsPerPage);
      
      if (direction === 'prev' && state.currentPage > 1) {
        state.currentPage--;
      } else if (direction === 'next' && state.currentPage < totalFilteredPages) {
        state.currentPage++;
      }
      
      render.posts(state.currentPage);
    }
  };

  // 事件监听
  document.addEventListener("click", handlers.handleCategoryClick);
  
  if (elements.prevBtn) {
    elements.prevBtn.addEventListener("click", (e) => handlers.handlePagination(e, 'prev'));
  }
  
  if (elements.nextBtn) {
    elements.nextBtn.addEventListener("click", (e) => handlers.handlePagination(e, 'next'));
  }

  // 初始化
  const initialize = () => {
    render.posts(state.currentPage);
    handlers.updateCategoryButtons("all");
    render.pagination();

    // 滚动容器优化
    const scrollContainer = document.getElementById("categories-scroll-container");
    if (scrollContainer) {
      scrollContainer.style.scrollBehavior = "smooth";
      
      const activeTag = scrollContainer.querySelector('[data-active="true"]');
      if (activeTag) {
        activeTag.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    }
  };

  // 页面加载完成后初始化
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize);
  } else {

title="友链" class="flex items-center gap-x-1.5 px-3 py-2 rounded-md text-sm font-medium flex-1 min-w-0 transition-colors duration-200 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-secondary" onclick="window.rightMenuDrawerController.close()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-link flex-shrink-0 text-gray-500 dark:text-gray-400"> <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>  </svg><span class="truncate font-medium" title="友链">友链</span></a></div></div><div data-menu-item><div class="flex items-center"><a href="/coding-one-more-time/about" title="关于" class="flex items-center gap-x-1.5 px-3 py-2 rounded-md text-sm font-medium flex-1 min-w-0 transition-colors duration-200 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-secondary" onclick="window.rightMenuDrawerController.close()"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info flex-shrink-0 text-gray-500 dark:text-gray-400"> <circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path>  </svg><span class="truncate font-medium" title="关于">关于</span></a></div></div></div></nav><script>
  // 垂直菜单子菜单切换函数
  function toggleVerticalSubmenu(event, button) {
    // 阻止事件冒泡
    if (event?.stopPropagation) event.stopPropagation();
    if (!button) return;

    // 找到子菜单元素和图标
    const menuItem = button.closest("[data-menu-item]");
    const submenu = menuItem?.querySelector("[data-submenu]");
    if (!menuItem || !submenu) return;

    // 确定图标位置并检查当前状态
    const isButtonFullWidth = button.classList.contains("flex-1");
    const icon = isButtonFullWidth
      ? button.querySelector("svg:last-child")
      : button.querySelector("svg");
    const isOpen = submenu.classList.contains("max-h-0");

    // 执行展开或收起动画
    if (isOpen) {
      // 展开动画
      submenu.setAttribute("data-open", "true");

      // 延迟设置max-h和opacity以确保动画正确触发
      setTimeout(() => {
        submenu.classList.add("mt-1");

        // 延迟添加mt-1类使间距变化更自然
        setTimeout(() => {
          submenu.classList.remove("max-h-0", "opacity-0");
          submenu.classList.add("max-h-96", "opacity-100");
        }, 50);
      }, 10);

      // 旋转图标
      if (icon) icon.style.transform = "rotate(180deg)";
    } else {
      // 收起动画 - 先移除mt-1类
      submenu.classList.remove("mt-1");

      // 延迟执行其他收起动画，使间距变化更自然
      setTimeout(() => {
        submenu.classList.remove("max-h-96", "opacity-100");
        submenu.classList.add("max-h-0", "opacity-0");

        // 延迟设置data-open属性
        setTimeout(() => submenu.setAttribute("data-open", "false"), 150);
      }, 50);

      // 恢复图标位置
      if (icon) icon.style.transform = "rotate(0deg)";
    }
  }

  // 添加到window对象使全局可访问
  window.toggleVerticalSubmenu = toggleVerticalSubmenu;
</script>  </div> </div> </div> <script>(function(){const drawerId = "rightMenuDrawer";
const position = "right";
const open = false;
const onOpenChange = undefined;

  // 抽屉控制函数
  const drawer = document.getElementById(drawerId);
  const overlay = document.getElementById(`${drawerId}Overlay`);
  const content = document.getElementById(`${drawerId}Content`);
  const closeBtn = document.getElementById(
    `close${drawerId.charAt(0).toUpperCase() + drawerId.slice(1)}`
  );

  const drawerController = {
    open() {
      if (drawer && overlay && content) {
        drawer.classList.remove("pointer-events-none", "opacity-0");
        overlay.classList.remove("opacity-0");
        content.classList.remove(
          "translate-x-full",
          "-translate-x-full",
          "translate-y-full",
          "-translate-y-full"
        );
        document.body.style.overflow = "hidden";

        // 触发 onOpenChange 回调
        if (typeof onOpenChange === "function") {
          onOpenChange(true);
        }
      }
    },

    close() {
      if (drawer && overlay && content) {
        overlay.classList.add("opacity-0");

        // 根据位置类型应用正确的移出方向类
        if (position === "right") {
          content.classList.add("translate-x-full");
        } else if (position === "left") {
          content.classList.add("-translate-x-full");
        } else if (position === "top") {
          content.classList.add("-translate-y-full");
        } else if (position === "bottom") {
          content.classList.add("translate-y-full");
        }

        setTimeout(() => {
          drawer.classList.add("pointer-events-none", "opacity-0");
          document.body.style.overflow = "";

          // 触发 onOpenChange 回调
          if (typeof onOpenChange === "function") {
            onOpenChange(false);
          }
        }, 300);
      }
    },

    toggle() {
      if (content) {
        const isClosed =
          content.classList.contains("translate-x-full") ||
          content.classList.contains("-translate-x-full") ||
          content.classList.contains("translate-y-full") ||
          content.classList.contains("-translate-y-full");

        if (isClosed) {
          this.open();
        } else {
          this.close();
        }
      }
    },
  };

  // 将控制器挂载到全局对象，方便外部调用
  // 使用下划线替代连字符，确保是有效的JavaScript变量名
  const controllerName = `${drawerId}`.replace(/-/g, "_") + "Controller";
  window[controllerName] = drawerController;

  // 同时保留原始的控制器名，以便向后兼容
  window[`${drawerId}Controller`] = drawerController;

  // 初始化事件监听
  document.addEventListener("DOMContentLoaded", () => {
    // 初始化显示状态
    if (open) {
      drawerController.open();
    } else {
      drawerController.close();
    }

    // 绑定关闭按钮事件
    if (closeBtn) {
      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        drawerController.close();
      });
    }

    // 绑定遮罩层点击事件
    if (overlay) {
      overlay.addEventListener("click", () => {
        drawerController.close();
      });
    }

    // ESC关闭
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const isOpen =
          content &&
          !(
            content.classList.contains("translate-x-full") ||
            content.classList.contains("-translate-x-full") ||
            content.classList.contains("translate-y-full") ||
            content.classList.contains("-translate-y-full")
          );

        if (isOpen) {
          drawerController.close();
        }
      }
    });
  });
})();</script> <script>(function(){const drawerId = "rightMenuDrawer";
