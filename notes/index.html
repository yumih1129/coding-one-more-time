        window.searchModalController.close();

  document.addEventListener("click", function (event) {

  // 动态检测搜索结果抽屉是否需要滚动条
  function updateDrawerScrollbar() {
    const drawer = document.querySelector(
      ".pagefind-ui-modal .pagefind-ui__drawer"
    );
    if (drawer) {
      const needsScrollbar = drawer.scrollHeight > drawer.clientHeight;
      if (needsScrollbar) {
        drawer.classList.add("has-scrollbar");
      } else {
        drawer.classList.remove("has-scrollbar");
      }
    }

  // 处理mark标签中的空格
  function processMarkTags() {
    const marks = document.querySelectorAll(
      ".pagefind-ui-modal .pagefind-ui__result-excerpt mark"
    );
    marks.forEach((mark) => {
      // 获取原始文本并去除前后空格
      const originalText = mark.textContent || "";
      const trimmedText = originalText.trim();

      // 如果文本有变化，更新内容
      if (originalText !== trimmedText) {
        mark.textContent = trimmedText;
      }

      // 同时处理内部的多个连续空格
      const normalizedText = trimmedText.replace(/\s+/g, " ");
      if (trimmedText !== normalizedText) {
        mark.textContent = normalizedText;
      }
    });
  }

  // 监听搜索结果变化
  const observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (mutation) {
      if (mutation.type === "childList") {
        updateDrawerScrollbar();
        // 处理mark标签中的空格
        processMarkTags();
      }
    });
  });

  // 修改搜索输入框的placeholder文本

  // 当搜索模态框关闭时停止监听

      localStorage.setItem("theme", "light");
    } else {
      document.documentElement.classList.add("dark");
      localStorage.setItem("theme", "dark");
    }
  }

  // 布局宽度管理 - 初始化与切换（防闪烁优化）
  (function () {
    const LAYOUT_KEY = "layoutWidth";
    const WIDE_CLASS = "w-full";
    const NARROW_CLASS = "container";

    // 预初始化：在DOM解析阶段应用保存的设置
    function preInitLayoutWidth() {
      const saved = localStorage.getItem(LAYOUT_KEY);
      if (saved === "wide") {
        // 使用CSSOM直接操作，避免重绘
        const style = document.createElement("style");
        style.textContent =
          ".layout { width: 100% !important; max-width: none !important; }";
        style.id = "layout-preinit";
        document.head.appendChild(style);
      }
    }

    // 应用布局宽度到所有元素
    function applyLayoutWidth(isWide) {
      // 移除预初始化样式
      const preinitStyle = document.getElementById("layout-preinit");
      if (preinitStyle) preinitStyle.remove();

      document.querySelectorAll(".layout").forEach((el) => {
        el.classList.toggle(WIDE_CLASS, isWide);
        el.classList.toggle(NARROW_CLASS, !isWide);
      });
    }

    // 初始化布局宽度
    function initLayoutWidth() {
      const saved = localStorage.getItem(LAYOUT_KEY);
      if (saved === "wide") applyLayoutWidth(true);
    }

    // 切换布局宽度
    window.toggleLayoutWidth = function () {
      const current = localStorage.getItem(LAYOUT_KEY) === "wide";
      const next = !current;

      applyLayoutWidth(next);
      localStorage.setItem(LAYOUT_KEY, next ? "wide" : "narrow");

      // 验证修正（防抖）
      clearTimeout(window._layoutVerifyTimer);
      window._layoutVerifyTimer = setTimeout(() => {
        const shouldBeWide = localStorage.getItem(LAYOUT_KEY) === "wide";
        document.querySelectorAll(".layout").forEach((el) => {
          const isWide = el.classList.contains(WIDE_CLASS);
          if (shouldBeWide !== isWide) {
            el.classList.toggle(WIDE_CLASS, shouldBeWide);
            el.classList.toggle(NARROW_CLASS, !shouldBeWide);
          }
        });
      }, 50);
    };

    // 预初始化（在DOM解析阶段执行）
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", preInitLayoutWidth);
    } else {
      preInitLayoutWidth();
    }

    // 完整初始化（DOM就绪后）
    if (document.readyState === "loading") {

<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right transition-transform duration-300 group-hover/link:translate-x-0.5"> <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>  </svg> <span class="absolute left-0 bottom-0 w-0 h-[1px] bg-primary transition-all duration-300 group-hover/link:w-full"></span> </a> </div> </div> </div> </div> </div> </article> </template> <script>(function(){const notesData = [{"id":"Java 30周年：Duke与你同行🎉.md","slug":"java-30周年duke与你同行","body":"Java在2025年5月23日（昨日）迎来了30周年纪念。为了庆祝这一重要时刻，JetBrains推出了一款名为“**Java 30 Anniversary**”的插件。安装该插件后，开发者每次启动开发工具时，都会看到Java的吉祥物Duke出现在启动画面上，仿佛Java在默默支持着每一位开发者。\n\n通过完成一个简单的测试，开发者可以解锁Duke的代码，享受这一独特的体验。相关设置可以在“**设置 > 外观与行为 > Java 30 Anniversary Splash Screen**”中找到。这个小小的举动不仅为开发过程增添了乐趣，也体现了Java社区对开发者的关怀和对Java历史的尊重。\n\n接下来，将分享一系列Java 30 Anniversary Splash Screen的内容，包括对应的角色代码、图标和描述。\n\n## 01. Shortcut sorcerer(快捷键魔法师)\n\n**Describe**：\n\nYou haven’t touched a mouse in years. You summon code with keystrokes and pure willpower.\n\n> 你已经多年没碰过鼠标了，你仅靠键盘按键和纯粹的意志力就能调用代码。\n\n**Character Code**：\n\nYour Duke character code：`2b40ec50ce31589592a9295a860409aa`。\n\n**Rendering**：\n\n![](assets/image-20250524112916.png)\n\n## 02. Romote-controlled dev（远程控制开发者）\n\n**Describe**：\n\nYou deploy from a hammock, respond from three time zones, and haven’t worn real pants since 2020.\n\n> 你躺在吊床上部署代码，跨越三个时区响应问题，自2020年以来就没再穿过正装裤。\n\n**Character Code**：\n\nYour Duke character code：`bc17df702c2c65ab9eea00c668f590c1`。\n\n**Rendering**：\n\n![](assets/image-20250524113031.png)\n\n## 03. Git philosopher（Git 哲学家）\n\n**Describe**：\n\nYou commit with intention and merge with grace. For you, every branch is a journey, and every rebase a meditation.\n\n> 你带着明确的意图提交代码，优雅地合并分支。对你来说，每一个分支都是一场旅程，每一次变基都是一次冥想。\n\n**Character Code**：\n\nYour Duke character code：`8d5859ddaf5134cc5ae4d4098ac2cd6e`。\n\n**Rendering**：\n\n![](assets/image-20250524113653.png)\n\n## 04. Syntax nomad（语法游牧者）\n\n**Describe**：\n\nYou don’t chase goals – you follow the flow. Lost routes, surprise errors? That’s all just part of the adventure.\n\n> 你不追逐目标，而是顺应流程。迷失的路径、意外的错误？这些全都是冒险的一部分。\n\n**Character Code**：\n\nYour Duke character code：`4ec8f48d0fd6b011e4a0bbc801cd41c3`。\n\n**Rendering**：\n\n![](assets/image-20250524113946.png)\n\n## 05. Container whisperer(容器低语者)\n\n**Describe**：\n\nYou deploy across clouds like it’s second nature. Docker listens, Kubernetes obeys, and somehow it all just works.\n\n> 你在云端部署应用就像呼吸一样自然。Docker会听从你的指令，Kubernetes会服从你的安排，不知何故，一切都能顺利运行。\n\n**Character Code**：\n\nYour Duke character code：`2d0e55ecd2adb48a19d1a579037813a0`。\n\n**Rendering**：\n\n![](assets/image-20250524115222.png)\n\n## 06. WARlord(WAR大领主)\n\n**Describe**：\n\nYou deploy apps that come in megabytes and leave behind smoke. If the server survives, it’s a win.\n\n> 你部署的应用程序动辄以兆字节计，运行时如同战场般硝烟弥漫。如果服务器能够幸存，那就算胜利了。\n\n**Character Code**：\n\nYour Duke character code：`a25c68853e9c2edc7c3a3508b325b5af`。\n\n**Rendering**：\n\n![](assets/image-20250524115443.png)\n\n## 07. Duke Nukem.java(公爵大冒险.java)\n\n**Describe**：\n\nYou code like an action movie: fast, bold, and with a big splash screen. Every feature is an entrance.\n\n> 你写代码就像拍动作片：快速、大胆，还带着一个超炫的启动画面。每个功能都像是一个惊艳的登场。\n\n**Character Code**：\n\nYour Duke character code：`fda9b7d363f53597b647322572c616ba`。\n\n**Rendering**：\n\n![](assets/image-20250524115642.png)\n\n## 08. IDE skeptic(IDE怀疑论者)\n\n**Describe**：\n\nYou trust your terminal more than any UI. If it needs a mouse, it probably needs a rethink.\n\n> 你更信任终端，而不是任何图形界面。如果需要鼠标，那它可能需要重新思考。\n\n**Character Code**：\n\nYour Duke character code：`3ad7a84642024a8e1ea14be3ce70bd78`。\n\n**Rendering**：\n\n![](assets/image-20250524115857.png)\n\n## 09. Meme-driven dev(梗驱动开发者)\n\n**Describe**：\n\nYou speak fluent meme. That’s how you explain bugs and survive reviews. No meme? Then, it didn’t happen.\n\n> 你精通各种梗。你用梗来解释漏洞，用梗来应对代码审查。没有梗？那这事就没发生过。\n\n**Character Code**：\n\nYour Duke character code：`0b435eb9bfc2464bd9ef61bb8d5d8846`。\n\n**Rendering**：\n\n![](assets/image-20250524120302.png)\n\n## 10. Director of agents(代理总监)\n\n**Describe**：\n\nYou don’t code, you command. The agents do your bidding, and you take the credit.\n\n> 你不是在写代码，而是在发号施令。代理们听从你的指令，而你则收获所有的赞誉。\n\n**Character Code**：\n\nYour Duke character code：`60d5d194ecf1215296d3cdcf719ca89d`。\n\n**Rendering**：\n\n![](assets/image-20250524120523.png)\n\n## 11. Microservice guru(微服务大师)\n\n**Describe**：\n\nYou see systems as stories – split, scalable, and speaking over HTTP. You don’t build apps. You shape universes.\n\n> 你将系统视为故事——它们被拆分、可扩展，并通过HTTP进行通信。你不是在构建应用程序，而是在塑造一个个宇宙。\n\n**Character Code**：\n\nYour Duke character code：`f69c946282538cbac54b9539c216def9`。\n\n**Rendering**：\n\n![](assets/image-20250524120722.png)\n\n## 12. IDE loyalist(IDE 忠诚者)\n\n**Describe**：\n\nYou picked your IDE once, and now it’s basically a lifestyle. When it crashes, you crash with it.\n\n> 你选择了一款 IDE，现在它几乎成了你的一种生活方式。当它崩溃时，你也会跟着崩溃。\n\n**Character Code**：\n\nYour Duke character code：`3a2ce589d224acb366b5116f84e86ca6`。\n\n**Rendering**：\n\n![](assets/image-20250524121028.png)\n\n## 13. Framework collector(框架收藏家)\n\n**Describe**：\n\nYou’ve seen every framework, tried most, and remember them all. Your toolbox is a museum, and you’re the curator.\n\n> 你见识过每一个框架，尝试过大多数，并且对它们都记忆犹新。你的工具箱就像一座博物馆，而你是馆长。\n\n**Character Code**：\n\nYour Duke character code：`69225e22e6ded2f60f1065db941a0f6e`。\n\n**Rendering**：\n\n![](assets/image-20250524121222.png)\n\n## 14. Lambda ambassador(Lambda 大使)\n\n**Describe**：\n\n-> is your signature. One-liners, your style. Clean, sharp, and just cryptic enough to make them wonder.\n\n> `->` 是你的标志。一行代码就是你的风格。简洁、锐利，且足够神秘，让人忍不住去琢磨。\n\n**Character Code**：\n\nYour Duke character code：`19672ab97b05acc9743cbbf560afaf18`。\n\n**Rendering**：\n\n![](assets/image-20250524121448.png)\n\n## 15. Zoom shadow(Zoom 影子)\n\n**Describe**：\n\nSince the pandemic, you’ve turned your camera on. Your teammates’ background talks is your productivity soundtrack.\n\n> 自从疫情开始，你一直开着摄像头。队友们背景中的交谈声就是你高效工作的背景音乐。\n\n**Character Code**：\n\nYour Duke character code：`110eefd412c6be4d2864894af8f3f0cb`。\n\n**Rendering**：\n\n![](assets/image-20250524121708.png)\n\n## 16. Friday deployer(周五部署者)\n\n**Describe**：\n\nYou ship on Fridays because you like to feel alive. It’s brave. It’s chaotic. It’s very you.\n\n> 你在周五进行部署，因为你喜欢那种充满活力的感觉。这是勇敢的，这是混乱的，这很像你。\n\n**Character Code**：\n\nYour Duke character code：`f76af4e3cd9b3832ee30c7919e99ae17`。\n\n**Rendering**：\n\n![](assets/image-20250524121928.png)\n\n## 17. Web chaos Duke(网页混乱公爵)\n\n**Describe**：\n\nYou built a homepage with four fonts, two applets, and one soul. No regrets, just GIFs.\n\n> 你用四种字体、两个小程序和一颗灵魂搭建了一个主页。没有遗憾，只有GIF图。\n\n**Character Code**：\n\nYour Duke character code：`f62cd724d63ad6f54151403bd73e874c`。\n\n**Rendering**：\n\n![](assets/image-20250524122159.png)\n\n## 18. Stack Overflow prophet(Stack Overflow先知)\n\n**Describe**：\n\nYou don’t debug, you find answers. Always in a 12-year-old thread with one upvote and \"This saved my life\" comment.\n\n> 你不是在调试，而是在寻找答案。总是在一个有12年历史的帖子中，只有一个点赞和“这救了我的命”的评论。\n\n**Character Code**：\n\nYour Duke character code：`e5c81f16e574e1f9c5f68f15b9d314f4`。\n\n**Rendering**：\n\n![](assets/image-20250524122434.png)\n\n## 19. The applet evangelist(小程序传道者)\n\n**Describe**：\n\nYou put Java in the browser and called it innovation. It blinked, and it crashed, but you believed.\n\n> 你把Java放到了浏览器里，并称之为创新。它闪烁，它崩溃，但你坚信不疑。\n\n**Character Code**：\n\nYour Duke character code：`83828e5cd7f44ca1a53c7197382ea224`。\n\n**Rendering**：\n\n![](assets/image-20250524122633.png)\n\n## 20. Dark theme Duke(暗黑主题公爵)\n\n**Describe**：\n\nYou code in the dark and you like it that way. Light mode is for quitters.\n\n> 你在黑暗中编码，并且喜欢这种方式。浅色模式是给那些半途而废的人准备的。\n\n**Character Code**：\n\nYour Duke character code：`b1ececb71ab88dfd65cf40966d8eb135`。\n\n**Rendering**：\n\n![](assets/image-20250524122848.png)\n\n## 21. Javafluencer(Java影响者)\n\n**Describe**：\n\nYou ship clean code and content. One hand on the keyboard, the other posting a tutorial that’s already going viral.\n\n> 你提供干净的代码和优质内容。一只手在键盘上飞舞，另一只手则在发布一个即将爆火的教程。\n\n**Character Code**：\n\nYour Duke character code：`ad383f39cbf1d69607223f66c07bdd1e`。\n\n**Rendering**：\n\n![](assets/image-20250524123445.png)\n\n## 22. Debugger in baggy jeans(穿宽松牛仔裤的调试大师)\n\n**Describe**：\n\nYou squash bugs in oversized hoodies with style. The stack trace fears you.\n\n> 你穿着宽松的连帽衫，以酷炫的风格消灭漏洞。堆栈跟踪都怕你。\n\n**Character Code**：\n\nYour Duke character code：`7cddee11a6a1af5477479c1aaad86f66`。\n\n**Rendering**：\n\n![](assets/image-20250524123655.png)\n\n## 23. AI-powered dev(AI驱动的开发者)\n\n**Describe**：\n\nYou no longer write code — you accept it. AI Assistant is your colleague, your editor, and maybe your therapist.\n\n> 你不再编写代码——你接受它。AI助手是你的同事、你的编辑，甚至可能是你的心理医生。\n\n**Character Code**：\n\nYour Duke character code：`935953a74313da7ec95c6dbfadfaca02`。\n\n**Rendering**：\n\n![](assets/image-20250524123903.png)\n\n## 24. Lord of agents(代理领主)\n\n**Describe**：\n\nAgents don’t help you; they work for you. They debug and refactor while you pull the strings.\n\n> 代理不是来帮助你的，而是为你工作的。它们负责调试和重构代码，而你则是幕后操纵的那个人。\n\n**Character Code**：\n\nYour Duke character code：`9116a07e790bd5af3f7f8a2bff210657`。\n\n**Rendering**：\n\n![](assets/image-20250524124227.png)\n\n## 25. Shift+Shift Duke(Shift+Shift公爵)\n\n**Describe**：\n\nYou summon IntelliJ IDEA search like it’s a superpower. If it’s not searchable, it doesn’t exist.\n\n> 你像使用超能力一样召唤IntelliJ IDEA的搜索功能。如果它不可搜索，那它就不存在。\n\n**Character Code**：\n\nYour Duke character code：`87c1125501ead2504419b534ffe1d00d`。\n\n**Rendering**：\n\n![](assets/image-20250524124616.png)\n\n## 26. Optional oracle(Optional神谕者)\n\n**Describe**：\n\nYou wrapped your whole codebase in Optional and called it peace of mind. Null can’t hurt you anymore.\n\n> 你将整个代码库都封装在`Optional`里，并称之为安心。空值（`null`）再也伤不到你了。\n\n**Character Code**：\n\nYour Duke character code：`1d8b5b90ef272c283a93a1f94fd16dd1`。\n\n**Rendering**：\n\n![](assets/image-20250524124827.png)\n\n## 27. Conference king(会议之王)\n\n**Describe**：\n\nYou attend talks, hoard stickers, and network like it’s a side quest. You came for the swag. You stayed for the swag.\n\n> 你参加讲座，收集贴纸，像完成一个支线任务一样拓展人脉。你是为了周边产品而来，也为了周边产品而留下。\n\n**Character Code**：\n\nYour Duke character code：`882c4006ef2fef660df2cc9d33c08198`。\n\n**Rendering**：\n\n![](assets/image-20250524125118.png)\n\n## 28. The JavaZilla(Java巨兽)\n\n**Describe**：\n\nOnce you wrote an app that devoured a team. No one understands it, but it still runs – somehow.\n\n> 曾经，你写了一个吞噬整个团队的应用程序。没人能理解它，但它仍然在运行——不知何故。\n\n**Character Code**：\n\nYour Duke character code：`6c0e8437227d1951391aeaa240f11cdd`。\n\n**Rendering**：\n\n![](assets/image-20250524125440.png)\n\n## 29. Stack trace therapist(堆栈跟踪治疗师)\n\n**Describe**：\n\nYou read errors like poetry and fix bugs with empathy. Your debugger is basically a confessional booth.\n\n> 你像读诗一样阅读错误信息，并带着同理心修复漏洞。你的调试器简直就是一间忏悔室。\n\n**Character Code**：\n\nYour Duke character code：`ed28f2945037a6d7a5985cc3d766bfeb`。\n\n**Rendering**：\n\n![](assets/image-20250524130842.png)\n\n## 30. Prompt perfectionist(提示词完美主义者)\n\n**Describe**：\n\nYou rewrite prompts like they’re haikus. When the AI finally gets it right, it feels like love.\n\n> 你像写俳句一样精心改写提示词。当AI终于理解正确时，那种感觉就像恋爱一样。\n\n**Character Code**：\n\nYour Duke character code：`5a0932b1ea26a39e72380fd7f4fd60c9`。\n\n**Rendering**：\n\n![](assets/image-20250524131254.png)","collection":"notes","data":{"title":"Java 30周年：Duke与你同行🎉","description":"Java在2025年5月23日，迎来了30周年纪念。JetBrains推出Java 30 Anniversary插件，开发者每次启动开发工具时，都会看到Java的吉祥物Duke出现在启动画面。","author":"Yumih","authorAvatar":"/coding-one-more-time/avatar.jpg","authorDescription":"7分技术，3分管理，2分运气","category":"技术文化","tags":["Java","Duke","开发者社区"],"flag":null,"chapter":null,"cover":"/coding-one-more-time/cover/java-30th-anniversary.webp","publishTime":"2025年05月23日","updateTime":"2025年05月24日",     formatCount: (n) => {
      if (n < 1_000) return String(n);
      if (n < 10_000) return (n / 1_000).toFixed(1).replace(/\.0$/, '') + 'k';
      if (n < 1_000_000) return (n / 10_000).toFixed(1).replace(/\.0$/, '') + 'w';
      if (n < 1_000_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'm';
      if (n < 1_000_000_000_000) return (n / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + 'b';
      return '999.9t+';
    },

    estimateWordCount: (description, wordCount) => {
      if (wordCount !== undefined && wordCount > 0) return wordCount;
      if (description) return Math.round(description.length * CONSTANTS.DESCRIPTION_WORD_RATIO);
      return 0;
    },

    estimateReadingTime: (wordCount) => {
      const minutes = Math.max(1, Math.round(wordCount / CONSTANTS.WORDS_PER_MINUTE));
      return `${minutes} 分钟`;
    },

    scrollToTop: () => {
      const scrollContainer = document.getElementById('content-container');
      const target = scrollContainer || window;
      target.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  // 分类元素创建函数
  const createCategoryElement = (category, hasPath) => {
    const categoryEl = document.createElement('span');
    categoryEl.className = 'group mr-1.5 rounded-xl px-2 py-0.5 h-6 text-xs font-medium';
    
    // 添加flagColors样式
    if (flagColors[category]) {
      categoryEl.classList.add(...flagColors[category].split(' '));
    } else {
      categoryEl.classList.add('bg-secondary', 'text-secondary-foreground');
    }
    
    if (hasPath) {
      categoryEl.innerHTML = `<a href="${categoriesPath}${category}" title="${category}" class="inline-flex gap-x-1 items-center h-5 cursor-pointer">${ICONS.TAG}<span>${category}</span></a>`;
    } else {
      categoryEl.innerHTML = `<span class="inline-flex gap-x-1 items-center h-5 cursor-default" title="${category}">${ICONS.TAG}<span>${category}</span></span>`;
    }
    
    return categoryEl;
  };

  const createMoreTagsElement = (remainingCount, remainingTags) => {
    const moreEl = document.createElement('span');
    moreEl.className = 'group rounded-xl bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground';
    moreEl.innerHTML = `<span class="inline-flex gap-x-0.5 items-center h-5 cursor-pointer" title="${remainingTags.join("；")}">${ICONS.PLUS}<span>${remainingCount}</span></span>`;
    return moreEl;
  };

  // 随笔卡片创建函数
  const cardCreators = {
    setupCategory: (card, note) => {
      const categoryBadge = card.querySelector(".category-badge");
      const categoryText = card.querySelector(".category-text");
      const categoryLink = card.querySelector(".category-link");
      
      if (note.data.category) {
        categoryText.textContent = note.data.category;
        
        // 添加flagColors样式
        if (flagColors[note.data.category]) {
          categoryBadge.classList.add(...flagColors[note.data.category].split(' '));
        }
        
        const hasCategoriesPath = categoriesPath && categoriesPath.trim() !== '';
        
        if (hasCategoriesPath) {
          categoryLink.href = `${categoriesPath}${note.data.category}`;
        } else {
          // 移除链接，只保留文本和图标
          const iconEl = categoryLink.querySelector("svg");
          const parent = categoryLink.parentNode;
          parent.innerHTML = '';
          if (iconEl) parent.appendChild(iconEl);
          parent.appendChild(categoryText);
        }
      } else {
        categoryBadge.style.display = "none";
      }
    },

    setupTags: (card, note) => {
      const tagsContainer = card.querySelector(".tags-container");
      const hasTagsPath = tagsPath && tagsPath.trim() !== '';
      
      if (note.data.tags && note.data.tags.length > 0) {
        const displayTags = note.data.tags.slice(0, CONSTANTS.TAGS_PER_CARD);
        const remainingTags = note.data.tags.slice(CONSTANTS.TAGS_PER_CARD);
        
        displayTags.forEach(tag => {
          tagsContainer.appendChild(createCategoryElement(tag, hasTagsPath));
        });
        
        if (note.data.tags.length > CONSTANTS.TAGS_PER_CARD) {
          tagsContainer.appendChild(createMoreTagsElement(note.data.tags.length - CONSTANTS.TAGS_PER_CARD, remainingTags));
        }
      }
    },

    setupAuthor: (card, note) => {
      const authorInfo = card.querySelector(".author-info");
      const authorName = card.querySelector(".author-name");
      const authorAvatar = card.querySelector(".author-avatar img");
      
      if (note.data.author) {
        authorName.textContent = note.data.author;
        authorAvatar.src = note.data.authorAvatar || CONSTANTS.DEFAULT_AVATAR;
        authorAvatar.alt = note.data.author;
      } else {
        authorInfo.style.display = "none";
      }
    },

    setupStats: (card, note) => {
      // 字数统计
      const wordCount = utils.estimateWordCount(note.data.description, note.data.wordCount);
      const wordCountText = card.querySelector(".word-count-text");
      const wordCountContainer = card.querySelector(".word-count-container");
      
      if (wordCount > 0) {
        wordCountText.textContent = utils.formatCount(wordCount);
      } else {
        wordCountContainer.style.display = "none";
      }

      // 阅读时间
      const readingTime = note.data.readingTime || utils.estimateReadingTime(wordCount);
      const readingTimeText = card.querySelector(".reading-time-text");
      const readingTimeContainer = card.querySelector(".reading-time");
      
      if (readingTime) {
        readingTimeText.textContent = readingTime;
      } else {
        readingTimeContainer.style.display = "none";
      }
    },

    setupCover: (card, note) => {
      const coverImage = card.querySelector(".cover-image");
      const coverContainer = card.querySelector(".cover-container");
      
      if (note.data.cover) {
        coverImage.src = note.data.cover;
        coverImage.alt = note.data.title;
        coverContainer.style.display = "block";
      } else {
        coverContainer.style.display = "none";
      }
    },

    setupLinks: (card, note) => {
      const titleLink = card.querySelector(".title-link");
      const viewDetailsLink = card.querySelector(".view-details");
      const titleText = note.data.title || note.slug;
      
      titleLink.href = `${basePath}${note.slug}`;
      titleLink.title = titleText;
      viewDetailsLink.href = `${basePath}${note.slug}`;
    },

    setupContent: (card, note) => {
      const titleText = note.data.title || note.slug;
      
      card.querySelector(".publish-date").textContent = note.data.publishTime;
      card.querySelector(".description-text").textContent = note.data.description;
      
      // 设置标题和链接
      const titleLink = card.querySelector(".title-link");
      titleLink.href = `${basePath}${note.slug}`;
      titleLink.title = titleText;
      card.querySelector(".title-text").textContent = titleText;
    },

    setupFlag: (card, note) => {
      const flagContainer = card.querySelector(".flag-container");
      const flagText = card.querySelector(".flag-text");
      const flagBadge = card.querySelector(".flag-container > *"); // Target the Badge element directly
      
      if (note.data.flag && flagColors[note.data.flag]) {
        flagText.textContent = note.data.flag;
        if (flagBadge) {
          flagBadge.classList.add(...flagColors[note.data.flag].split(' '));
        }
        flagContainer.style.display = "block";
      } else {
        flagContainer.style.display = "none";
      }
    }
  };

  // 创建随笔卡片
  function createNoteCard(note) {
    const template = document.getElementById("note-card-template");
    const card = template.content.cloneNode(true);
    const titleText = note.data.title || note.slug;

    // 设置基本信息
    card.querySelector(".publish-date").textContent = note.data.publishTime;
    card.querySelector(".description-text").textContent = note.data.description;
    
    // 设置描述和作者信息的title属性
    if (note.data.description) {
      card.querySelector(".description-text").setAttribute("title", note.data.description);
    }
    if (note.data.authorDescription) {
      card.querySelector(".author-info").setAttribute("title", note.data.authorDescription);
    }
    
    // 设置标题和链接
    const titleLink = card.querySelector(".title-link");
    titleLink.href = `${basePath}${note.slug}`;
    titleLink.title = titleText;
    card.querySelector(".title-text").textContent = titleText;
    
    // 设置分类、标签、作者、统计信息、封面图、旗帜
    cardCreators.setupCategory(card, note);
    cardCreators.setupTags(card, note);
    cardCreators.setupAuthor(card, note);
    cardCreators.setupStats(card, note);
    cardCreators.setupCover(card, note);
    cardCreators.setupLinks(card, note);
    cardCreators.setupFlag(card, note);

    return card;
  }

  // 渲染函数
  const render = {
    emptyState: () => {
      return `
        <div class="text-center py-12">
          <div class="text-muted-foreground mb-4">
            ${ICONS.EMPTY}
            <p class="text-lg font-medium">暂无随笔</p>
            <p class="text-sm">当前分类下还没有发布任何随笔</p>
          </div>
        </div>
      `;
    },

    notes: (page = 1) => {
      if (!elements.notesContainer) return;

      const tempContainer = document.createElement('div');
      tempContainer.className = 'blog1__content flex flex-col gap-4 lg:gap-6 mb-6';
      tempContainer.style.opacity = '0';
      tempContainer.style.transition = `opacity ${CONSTANTS.TRANSITION_DURATION}ms ease-in-out`;

      const startIndex = (page - 1) * notesPerPage;
      const endIndex = startIndex + notesPerPage;
      const currentNotes = state.filteredNotes.slice(startIndex, endIndex);

      if (currentNotes.length === 0) {
        tempContainer.innerHTML = render.emptyState();
      } else {
        currentNotes.forEach(note => {
          tempContainer.appendChild(createNoteCard(note));
        });
      }

      elements.notesContainer.style.opacity = '0';
      
      setTimeout(() => {
        elements.notesContainer.innerHTML = tempContainer.innerHTML;
        
        setTimeout(() => {
          elements.notesContainer.style.opacity = '1';
          utils.scrollToTop();
        }, CONSTANTS.SCROLL_DELAY);
      }, CONSTANTS.CONTENT_SWITCH_DELAY);

      render.pagination();
    },

    pagination: () => {
      if (!elements.prevBtn || !elements.nextBtn || !elements.pageInfo || !elements.totalCount || !elements.totalPagesEl) return;

      const totalFilteredPages = Math.ceil(state.filteredNotes.length / notesPerPage);

      elements.pageInfo.textContent = `第 ${state.currentPage}/${totalFilteredPages} 页`;
      elements.totalCount.textContent = state.filteredNotes.length;
      elements.totalPagesEl.textContent = totalFilteredPages;

      elements.prevBtn.disabled = state.currentPage <= 1;
      elements.nextBtn.disabled = state.currentPage >= totalFilteredPages;

      const updateButtonState = (btn, isDisabled) => {
        if (isDisabled) {
          btn.classList.add("opacity-50", "cursor-not-allowed");
          btn.classList.remove("hover:bg-primary/10", "hover:text-primary");
        } else {
          btn.classList.remove("opacity-50", "cursor-not-allowed");
          btn.classList.add("hover:bg-primary/10", "hover:text-primary");
        }
      };

      updateButtonState(elements.prevBtn, elements.prevBtn.disabled);
      updateButtonState(elements.nextBtn, elements.nextBtn.disabled);
    }
  };

  // 更新分页控件
  const updatePagination = () => {
    if (!elements.prevBtn || !elements.nextBtn || !elements.pageInfo) return;
    
    const totalPages = Math.ceil(state.filteredNotes.length / notesPerPage);
    
    elements.prevBtn.disabled = state.currentPage <= 1;
    elements.nextBtn.disabled = state.currentPage >= totalPages;
    
    elements.pageInfo.innerHTML = `第 ${state.currentPage}/${totalPages} 页`;
    elements.totalCount.textContent = state.filteredNotes.length;
    elements.totalPagesEl.textContent = totalPages;
  };

  // 分类处理函数
  const categoryHandlers = {
    filterByCategory: (category) => {
      state.currentCategory = category;
      state.currentPage = 1;

      if (category === "all") {
        state.filteredNotes = [...notesData];
      } else {
        state.filteredNotes = notesData.filter(note => note.data.category === category);
      }

      render.notes(state.currentPage);
      utils.scrollToTop();
    },

    updateCategoryButtons: (category) => {
      const categoryButtons = document.querySelectorAll(".category-btn");
      categoryButtons.forEach(btn => {
        const isActive = btn.getAttribute("data-category") === category;
        const hasColor = btn.getAttribute("data-has-color") === 'true';
        const categoryName = btn.getAttribute("data-category");
        
        if (isActive) {
          btn.setAttribute("data-active", "true");
          
          // 如果分类有对应的flagColors，应用动态颜色
          if (hasColor && flagColors[categoryName]) {
            // 移除默认的primary样式
            btn.classList.remove('data-[active=true]:bg-primary', 'data-[active=true]:text-primary-foreground');
            // 添加flagColors样式
            btn.classList.add(...flagColors[categoryName].split(' '));
            
            // 同时更新计数标签的样式
            const countBadge = btn.querySelector('.ml-auto');
            if (countBadge) {
              countBadge.classList.remove('bg-secondary', 'text-secondary-foreground');
              countBadge.classList.add('bg-primary-foreground', 'text-primary');
            }
          }
        } else {
          btn.removeAttribute("data-active");
          
          // 恢复默认样式
          if (hasColor && flagColors[categoryName]) {
            // 移除flagColors样式
            btn.classList.remove(...flagColors[categoryName].split(' '));
            // 恢复默认的primary样式
            btn.classList.add('data-[active=true]:bg-primary', 'data-[active=true]:text-primary-foreground');
            
            // 恢复计数标签的默认样式
            const countBadge = btn.querySelector('.ml-auto');
            if (countBadge) {
              countBadge.classList.remove('bg-primary-foreground', 'text-primary');
              countBadge.classList.add('bg-secondary', 'text-secondary-foreground');
            }
          }
        }
      });
    },

    handleCategoryClick: (e) => {
      const categoryBtn = e.target.closest(".category-btn");
      if (!categoryBtn) return;
      
      e.preventDefault();
      const category = categoryBtn.getAttribute("data-category");
      categoryHandlers.filterByCategory(category);
      categoryHandlers.updateCategoryButtons(category);
    }
  };

  // 分页处理函数
  const paginationHandlers = {
    handlePrevPage: (e) => {
      e.preventDefault();
      const totalFilteredPages = Math.ceil(state.filteredNotes.length / notesPerPage);
      
      if (state.currentPage > 1) {
        state.currentPage--;
        render.notes(state.currentPage);
      }
    },

    handleNextPage: (e) => {
      e.preventDefault();
      const totalFilteredPages = Math.ceil(state.filteredNotes.length / notesPerPage);
      
      if (state.currentPage < totalFilteredPages) {
        state.currentPage++;
        render.notes(state.currentPage);
      }
    }
  };

  // 事件监听
  document.addEventListener("click", categoryHandlers.handleCategoryClick);
  
  if (elements.prevBtn) {
    elements.prevBtn.addEventListener("click", paginationHandlers.handlePrevPage);
  }
  
  if (elements.nextBtn) {
    elements.nextBtn.addEventListener("click", paginationHandlers.handleNextPage);
  }

  // 初始化
  const initialize = () => {
    render.notes(1);
    categoryHandlers.updateCategoryButtons("all");

    // 滚动容器优化
    const scrollContainer = document.getElementById("categories-scroll-container");
    if (scrollContainer) {
      scrollContainer.style.scrollBehavior = "smooth";
      
      const activeTag = scrollContainer.querySelector('[data-active="true"]');
      if (activeTag) {
        activeTag.scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    }
  };

  // 页面加载完成后初始化
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize);
  } else {
    initialize();
  }
})();</script>  </div> <!-- 底部区域 --> <div class="mt-auto"> <div class="shrink-0 bg-border transition-colors duration-300 h-px w-full" aria-hidden="true"></div> <footer class="flex flex-col gap-1 text-sm text-muted-foreground tracking-wide container mx-auto py-2 footer layout" role="contentinfo"> <!-- 顶部区域：版权信息和运行时间 --> <div class="leading-6 flex justify-between flex-col items-center md:items-stretch md:flex-row"> <!-- 版权信息 --> <div class="flex gap-x-2"> <p>

  // 垂直菜单子菜单切换函数
  function toggleVerticalSubmenu(event, button) {
    // 阻止事件冒泡
    if (event?.stopPropagation) event.stopPropagation();
    if (!button) return;

    // 找到子菜单元素和图标
    const menuItem = button.closest("[data-menu-item]");
    const submenu = menuItem?.querySelector("[data-submenu]");
    if (!menuItem || !submenu) return;

    // 确定图标位置并检查当前状态
    const isButtonFullWidth = button.classList.contains("flex-1");
    const icon = isButtonFullWidth
      ? button.querySelector("svg:last-child")
      : button.querySelector("svg");
    const isOpen = submenu.classList.contains("max-h-0");

    // 执行展开或收起动画
    if (isOpen) {
      // 展开动画
      submenu.setAttribute("data-open", "true");

      // 延迟设置max-h和opacity以确保动画正确触发
      setTimeout(() => {
        submenu.classList.add("mt-1");

        // 延迟添加mt-1类使间距变化更自然
        setTimeout(() => {
          submenu.classList.remove("max-h-0", "opacity-0");
          submenu.classList.add("max-h-96", "opacity-100");
        }, 50);
      }, 10);

      // 旋转图标
      if (icon) icon.style.transform = "rotate(180deg)";
    } else {
      // 收起动画 - 先移除mt-1类
      submenu.classList.remove("mt-1");

      // 延迟执行其他收起动画，使间距变化更自然
      setTimeout(() => {
        submenu.classList.remove("max-h-96", "opacity-100");
        submenu.classList.add("max-h-0", "opacity-0");

        // 延迟设置data-open属性
        setTimeout(() => submenu.setAttribute("data-open", "false"), 150);
      }, 50);

      // 恢复图标位置
      if (icon) icon.style.transform = "rotate(0deg)";
    }
  }

  // 添加到window对象使全局可访问
  window.toggleVerticalSubmenu = toggleVerticalSubmenu;
</script>  </div> </div> </div> <script>(function(){const drawerId = "rightMenuDrawer";
const position = "right";
const open = false;
const onOpenChange = undefined;

  // 抽屉控制函数
  const drawer = document.getElementById(drawerId);
  const overlay = document.getElementById(`${drawerId}Overlay`);
  const content = document.getElementById(`${drawerId}Content`);
  const closeBtn = document.getElementById(
    `close${drawerId.charAt(0).toUpperCase() + drawerId.slice(1)}`
  );

  const drawerController = {
    open() {
      if (drawer && overlay && content) {
        drawer.classList.remove("pointer-events-none", "opacity-0");
        overlay.classList.remove("opacity-0");
        content.classList.remove(
          "translate-x-full",
          "-translate-x-full",
          "translate-y-full",
          "-translate-y-full"
        );
        document.body.style.overflow = "hidden";

        // 触发 onOpenChange 回调
        if (typeof onOpenChange === "function") {
          onOpenChange(true);
        }
      }
    },

    close() {
      if (drawer && overlay && content) {
        overlay.classList.add("opacity-0");

        // 根据位置类型应用正确的移出方向类
        if (position === "right") {
          content.classList.add("translate-x-full");
        } else if (position === "left") {
          content.classList.add("-translate-x-full");
        } else if (position === "top") {
          content.classList.add("-translate-y-full");
        } else if (position === "bottom") {
          content.classList.add("translate-y-full");
        }

        setTimeout(() => {
          drawer.classList.add("pointer-events-none", "opacity-0");
          document.body.style.overflow = "";

          // 触发 onOpenChange 回调
          if (typeof onOpenChange === "function") {
            onOpenChange(false);
          }
        }, 300);
      }
    },

    toggle() {
      if (content) {
        const isClosed =
          content.classList.contains("translate-x-full") ||
          content.classList.contains("-translate-x-full") ||
          content.classList.contains("translate-y-full") ||
          content.classList.contains("-translate-y-full");

        if (isClosed) {
          this.open();
        } else {
          this.close();
        }
      }
    },
  };

  // 将控制器挂载到全局对象，方便外部调用
  // 使用下划线替代连字符，确保是有效的JavaScript变量名
  const controllerName = `${drawerId}`.replace(/-/g, "_") + "Controller";
  window[controllerName] = drawerController;

  // 同时保留原始的控制器名，以便向后兼容
  window[`${drawerId}Controller`] = drawerController;

  // 初始化事件监听
  document.addEventListener("DOMContentLoaded", () => {
    // 初始化显示状态
    if (open) {
      drawerController.open();
    } else {
      drawerController.close();
    }

    // 绑定关闭按钮事件
    if (closeBtn) {
      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        drawerController.close();
      });
    }

    // 绑定遮罩层点击事件
    if (overlay) {
      overlay.addEventListener("click", () => {
        drawerController.close();
      });
    }

    // ESC关闭
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        const isOpen =
          content &&
          !(
            content.classList.contains("translate-x-full") ||
            content.classList.contains("-translate-x-full") ||
            content.classList.contains("translate-y-full") ||
            content.classList.contains("-translate-y-full")
          );

        if (isOpen) {
          drawerController.close();
        }
      }
    });
  });
})();</script> <script>(function(){const drawerId = "rightMenuDrawer";
